<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090719">
  <title>스킬 오버드라이브</title>
  <style>
    :root {
      --ink: #f5f2ff;
      --muted: #ada7c7;
      --panel: rgba(12, 10, 34, .84);
      --line: rgba(157, 126, 255, .28);
      --cyan: #4ef4ff;
      --violet: #9c5cff;
      --magenta: #ff43cd;
      --gold: #ffd56a;
      --danger: #ff557f;
      --good: #6affc1;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #090719;
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 15% 20%, rgba(78,244,255,.13), transparent 27rem),
        radial-gradient(circle at 82% 80%, rgba(255,67,205,.13), transparent 28rem),
        #090719;
      isolation: isolate;
    }

    .app::after {
      position: fixed;
      z-index: 30;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: .11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .title {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(420px, .86fr) minmax(420px, 1.14fr);
      overflow: auto;
      background:
        linear-gradient(90deg, rgba(8,7,25,.98) 0 36%, rgba(8,7,25,.66) 62%, rgba(8,7,25,.28)),
        url("assets/skill-overdrive/optimized/arena-cosmic-v1.png") center / cover;
    }

    .title-copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(32px, 6vw, 92px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--cyan);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 760px;
      margin-bottom: 14px;
      font-size: clamp(3.2rem, 7vw, 7.6rem);
      line-height: .82;
      letter-spacing: -.085em;
      text-shadow: 0 0 34px rgba(156,92,255,.34);
    }

    h1 span {
      display: block;
      margin-top: 14px;
      color: transparent;
      background: linear-gradient(90deg, var(--cyan), #fff, var(--magenta));
      background-clip: text;
      font-size: .38em;
      letter-spacing: -.05em;
    }

    .lead {
      max-width: 570px;
      margin-bottom: 26px;
      color: #c8c3dc;
      font-size: .98rem;
      line-height: 1.75;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .badge {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #dcd8ef;
      background: rgba(255,255,255,.05);
      font-size: .69rem;
      font-weight: 850;
    }

    .menu {
      display: grid;
      width: min(410px, 100%);
      gap: 10px;
    }

    .menu-button,
    .modal-button {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      gap: 13px;
      padding: 11px 17px 11px 11px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 15px;
      color: white;
      background: linear-gradient(110deg, rgba(36,29,78,.94), rgba(19,16,51,.94));
      box-shadow: inset 0 1px rgba(255,255,255,.1), 0 10px 28px rgba(0,0,0,.22);
      cursor: pointer;
      font-weight: 900;
      text-align: left;
      transition: .15s ease;
    }

    .menu-button:hover,
    .modal-button:hover {
      border-color: var(--cyan);
      transform: translateX(4px);
      box-shadow: 0 0 24px rgba(78,244,255,.18);
    }

    .key {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 10px;
      color: #090719;
      background: linear-gradient(145deg, white, var(--cyan));
      box-shadow: 0 0 16px rgba(78,244,255,.42);
      font-size: .8rem;
      font-weight: 950;
    }

    .menu-button small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
    }

    .title-art {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      pointer-events: none;
    }

    .title-art::before {
      position: absolute;
      width: min(68vw, 760px);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      border: 1px solid rgba(78,244,255,.25);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(156,92,255,.23), transparent 63%);
      box-shadow: 0 0 110px rgba(156,92,255,.2), inset 0 0 100px rgba(78,244,255,.06);
      content: "";
      transform: translate(-48%, -50%);
    }

    .title-hero {
      position: absolute;
      width: min(76vh, 690px);
      max-width: 92%;
      max-height: 95vh;
      right: 5%;
      bottom: -4%;
      object-fit: contain;
      filter: drop-shadow(0 30px 40px rgba(0,0,0,.72)) drop-shadow(0 0 25px rgba(78,244,255,.2));
      animation: hover 4.5s ease-in-out infinite;
    }

    @keyframes hover {
      50% { transform: translateY(-10px); }
    }

    .hero-name {
      position: absolute;
      right: 5%;
      bottom: 6%;
      color: rgba(255,255,255,.25);
      font-size: clamp(3rem, 9vw, 9rem);
      font-weight: 950;
      letter-spacing: -.08em;
      writing-mode: vertical-rl;
    }

    .game {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #04030c;
    }

    .game-shell {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #08061a;
      box-shadow: 0 0 80px #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: absolute;
      z-index: 4;
      inset: 0;
      padding: clamp(10px, 1.7vw, 24px);
      pointer-events: none;
    }

    .hud-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 14px;
    }

    .player-panel {
      width: min(340px, 34vw);
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(8,7,25,.72);
      box-shadow: inset 0 1px rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: .7rem;
      font-weight: 900;
    }

    .bar {
      height: 9px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 99px;
      background: rgba(0,0,0,.5);
      overflow: hidden;
    }

    .bar > i {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--danger), #ff9f74);
      box-shadow: 0 0 13px rgba(255,85,127,.65);
      transition: width .2s ease;
    }

    .bar.xp { margin-top: 5px; height: 6px; }
    .bar.xp > i {
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      box-shadow: 0 0 13px rgba(78,244,255,.65);
    }

    .timer {
      min-width: 116px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8,7,25,.74);
      backdrop-filter: blur(8px);
      font-size: clamp(1.25rem, 2.4vw, 2rem);
      font-weight: 950;
      letter-spacing: -.05em;
      text-align: center;
    }

    .timer small {
      display: block;
      margin-bottom: 1px;
      color: var(--muted);
      font-size: .55rem;
      letter-spacing: .12em;
    }

    .score-panel {
      justify-self: end;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(8,7,25,.72);
      text-align: right;
      backdrop-filter: blur(8px);
    }

    .score-panel strong {
      display: block;
      font-size: clamp(1.15rem, 2.3vw, 1.9rem);
      letter-spacing: -.04em;
    }

    .score-panel small {
      color: var(--gold);
      font-size: .63rem;
      font-weight: 850;
    }

    .combo {
      position: absolute;
      top: 20%;
      right: clamp(12px, 2vw, 28px);
      color: white;
      font-size: clamp(1.2rem, 3vw, 2.7rem);
      font-style: italic;
      font-weight: 950;
      text-align: right;
      text-shadow: 0 0 16px var(--magenta);
      transform: skewX(-5deg);
      transition: transform .12s ease;
    }

    .combo small {
      display: block;
      color: var(--magenta);
      font-size: .35em;
      letter-spacing: .16em;
    }

    .skill-rack {
      position: absolute;
      left: clamp(10px, 1.7vw, 24px);
      bottom: clamp(10px, 1.7vw, 24px);
      display: flex;
      max-width: min(820px, 72vw);
      flex-wrap: wrap-reverse;
      gap: 7px;
    }

    .skill-chip {
      width: clamp(48px, 5vw, 67px);
      padding: 7px 5px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      color: white;
      background: rgba(8,7,25,.78);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .skill-chip span {
      display: grid;
      width: 28px;
      height: 28px;
      margin: 0 auto 4px;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(145deg, rgba(78,244,255,.24), rgba(156,92,255,.32));
      font-size: 1rem;
    }

    .skill-chip small {
      display: block;
      overflow: hidden;
      font-size: .48rem;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-chip b {
      color: var(--cyan);
      font-size: .55rem;
    }

    .boss-bar {
      position: absolute;
      top: clamp(74px, 10vw, 96px);
      left: 50%;
      width: min(510px, 70vw);
      padding: 7px 11px 9px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(8,7,25,.82);
      transform: translateX(-50%);
      backdrop-filter: blur(8px);
    }

    .boss-bar label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: #e8ddff;
      font-size: .64rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .boss-bar .bar > i {
      background: linear-gradient(90deg, var(--violet), var(--magenta));
    }

    .pause-button {
      position: absolute;
      z-index: 5;
      right: clamp(10px, 1.7vw, 24px);
      bottom: clamp(10px, 1.7vw, 24px);
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 13px;
      color: white;
      background: rgba(8,7,25,.78);
      cursor: pointer;
      pointer-events: auto;
    }

    .overlay {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(4,3,15,.72);
      backdrop-filter: blur(9px);
    }

    .modal {
      width: min(1010px, 100%);
      max-height: 94vh;
      padding: clamp(20px, 3.4vw, 40px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 26px;
      background:
        linear-gradient(135deg, rgba(26,21,64,.96), rgba(9,8,28,.98));
      box-shadow: 0 30px 90px rgba(0,0,0,.6), inset 0 1px rgba(255,255,255,.1);
      overflow: auto;
    }

    .modal.center {
      width: min(540px, 100%);
      text-align: center;
    }

    .modal h2 {
      margin-bottom: 8px;
      font-size: clamp(2rem, 4.2vw, 3.8rem);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .modal > p {
      color: var(--muted);
      line-height: 1.65;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 1.6vw, 18px);
      margin-top: 26px;
    }

    .card {
      position: relative;
      min-height: 320px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;
      color: white;
      background:
        radial-gradient(circle at 50% 10%, var(--card-glow, rgba(78,244,255,.23)), transparent 42%),
        linear-gradient(155deg, rgba(43,34,91,.98), rgba(13,11,38,.98));
      box-shadow: inset 0 1px rgba(255,255,255,.12), 0 16px 30px rgba(0,0,0,.25);
      cursor: pointer;
      text-align: left;
      transition: .18s ease;
      overflow: hidden;
    }

    .card::after {
      position: absolute;
      inset: auto -35% -50% -35%;
      height: 70%;
      border-radius: 50%;
      background: var(--card-glow, rgba(78,244,255,.2));
      filter: blur(38px);
      content: "";
      opacity: .4;
    }

    .card:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 35px rgba(78,244,255,.22);
      transform: translateY(-7px);
    }

    .card.evolution {
      border-color: rgba(255,213,106,.7);
      --card-glow: rgba(255,213,106,.32);
    }
    .card.transcend {
      border-color: rgba(255,255,255,.82);
      background: linear-gradient(145deg, rgba(255,213,106,.12), rgba(78,244,255,.1), rgba(255,67,205,.12)), var(--panel-2);
      --card-glow: rgba(255,255,255,.38);
      box-shadow: 0 0 42px rgba(255,255,255,.16);
    }

    .card .key { margin-bottom: 28px; }
    .card-icon {
      display: grid;
      width: 68px;
      height: 68px;
      margin-bottom: 15px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.07);
      box-shadow: inset 0 0 24px var(--card-glow, rgba(78,244,255,.18));
      font-size: 2.1rem;
    }

    .card-icon.skill-art {
      background-image: url("assets/skill-overdrive/optimized/skill-card-atlas-v1.png");
      background-repeat: no-repeat;
      background-size: 300% 200%;
      box-shadow: 0 0 24px var(--card-glow, rgba(78,244,255,.22));
    }

    .card-icon.utility-art,
    .skill-chip span.utility-art {
      background-image: url("assets/skill-overdrive/optimized/utility-card-atlas-v1.png");
      background-repeat: no-repeat;
      background-size: 300% 200%;
      box-shadow: 0 0 24px var(--card-glow, rgba(78,244,255,.22));
    }

    .skill-chip span.utility-art {
      border: 1px solid rgba(255,255,255,.16);
      font-size: 0;
    }

    .character-modal { width: min(1060px, 100%); }
    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }

    .character-card {
      position: relative;
      min-height: 390px;
      padding: 0 18px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 22px;
      color: white;
      background: linear-gradient(160deg, rgba(47,38,95,.96), rgba(10,9,31,.98));
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      transition: .2s ease;
    }

    .character-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 38px rgba(78,244,255,.22);
      transform: translateY(-6px);
    }

    .character-card .key { position: absolute; z-index: 2; top: 14px; left: 14px; }
    .character-portrait {
      display: block;
      width: 100%;
      height: 245px;
      object-fit: contain;
      filter: drop-shadow(0 0 24px var(--character-glow));
    }

    .character-card h3 { margin: -4px 0 5px; font-size: 1.35rem; }
    .character-card p { color: #bbb4d3; font-size: .72rem; line-height: 1.55; }
    .character-trait { display: block; margin-top: 9px; color: var(--cyan); font-size: .65rem; font-weight: 900; }

    .evolution-modal {
      position: relative;
      isolation: isolate;
      background:
        linear-gradient(rgba(8,6,29,.48), rgba(8,6,29,.94)),
        url("assets/skill-overdrive/optimized/ultimate-cut-in-v1.png") center/cover;
      box-shadow: 0 0 90px rgba(255,67,205,.34);
    }

    .volume {
      width: min(190px, 44vw);
      accent-color: var(--cyan);
    }

    .quality-select {
      min-width: 150px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      color: white;
      background: #17132f;
      font: inherit;
      font-size: .72rem;
      font-weight: 800;
    }

    .build-summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 15px 0 4px;
    }

    .build-pill {
      padding: 7px 10px;
      border: 1px solid rgba(78,244,255,.2);
      border-radius: 999px;
      color: #dcd8ef;
      background: rgba(255,255,255,.05);
      font-size: .62rem;
      font-weight: 850;
    }

    .card-type {
      margin-bottom: 5px;
      color: var(--cyan);
      font-size: .58rem;
      font-weight: 950;
      letter-spacing: .15em;
    }

    .card.evolution .card-type { color: var(--gold); }
    .card.transcend .card-type { color: #fff; text-shadow: 0 0 14px var(--cyan); }
    .card h3 { margin-bottom: 8px; font-size: 1.18rem; }
    .card p { color: #c3bdd7; font-size: .76rem; line-height: 1.6; }
    .card .change {
      position: absolute;
      z-index: 1;
      right: 15px;
      bottom: 14px;
      left: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.12);
      color: white;
      font-size: .65rem;
      font-weight: 850;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin: 22px 0;
    }

    .result-stat {
      padding: 13px 8px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.045);
    }

    .result-stat b { display: block; font-size: 1.3rem; }
    .result-stat small { color: var(--muted); font-size: .62rem; }

    .modal-actions {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }

    .modal-button { justify-content: center; text-align: center; }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.1);
      color: #d6d1e7;
      font-size: .82rem;
      text-align: left;
    }

    .switch {
      width: 52px;
      height: 28px;
      padding: 3px;
      border: 0;
      border-radius: 99px;
      background: #393450;
      cursor: pointer;
    }

    .switch i {
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      transition: .2s ease;
    }

    .switch.on { background: linear-gradient(90deg, var(--violet), var(--cyan)); }
    .switch.on i { transform: translateX(24px); }

    .toast {
      position: absolute;
      z-index: 20;
      top: 22%;
      left: 50%;
      padding: 11px 17px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      color: white;
      background: rgba(8,7,25,.87);
      box-shadow: 0 0 28px rgba(156,92,255,.35);
      font-size: .76rem;
      font-weight: 900;
      transform: translate(-50%, -10px);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .joystick {
      position: absolute;
      z-index: 7;
      left: 24px;
      bottom: 24px;
      display: none;
      width: 136px;
      height: 136px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      background: rgba(7,6,23,.45);
      touch-action: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .joystick.active {
      border-color: rgba(78,244,255,.62);
      box-shadow: 0 0 30px rgba(78,244,255,.22), inset 0 0 30px rgba(156,92,255,.12);
    }

    .stick {
      position: absolute;
      width: 56px;
      height: 56px;
      top: 40px;
      left: 40px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, var(--cyan), var(--violet));
      box-shadow: 0 0 25px rgba(78,244,255,.38);
    }

      const keys = new Set();

      class AudioEngine {
        constructor() {
          this.context = null;
          this.master = null;
          this.music = null;
          this.sfx = null;
          this.tones = [];
          this.lastHit = 0;
          this.lastSkill = 0;
        }

        ensure() {
          if (!this.context) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            this.context = new AudioContext();
            this.master = this.context.createGain();
            this.music = this.context.createGain();
            this.sfx = this.context.createGain();
            this.music.connect(this.master);
            this.sfx.connect(this.master);
            this.master.connect(this.context.destination);
          }
          if (this.context.state === "suspended") this.context.resume();
          this.applyOptions();
        }

        applyOptions() {
          if (!this.master) return;
          this.master.gain.setTargetAtTime(options.muted ? 0 : options.volume, this.context.currentTime, .025);
          this.music.gain.value = .16;
          this.sfx.gain.value = .42;
        }

        startMusic() {
          this.ensure();
          if (!this.context || this.tones.length) return;
          [55, 82.41, 110].forEach((frequency, index) => {
            const oscillator = this.context.createOscillator();
            const gain = this.context.createGain();
            oscillator.type = index === 0 ? "sawtooth" : index === 1 ? "triangle" : "sine";
            oscillator.frequency.value = frequency;
            gain.gain.value = index === 0 ? .09 : .045;
            oscillator.connect(gain);
            gain.connect(this.music);
            oscillator.start();
            this.tones.push({ oscillator, gain, base: frequency });
          });
        }

        setIntensity(level) {
          if (!this.context) return;
          this.tones.forEach((tone, index) => {
            tone.oscillator.frequency.setTargetAtTime(tone.base * (1 + level * .055), this.context.currentTime, .3);
            tone.gain.gain.setTargetAtTime((index ? .045 : .09) * (1 + level * .2), this.context.currentTime, .3);
          });
        }

        stopMusic() {
          this.tones.forEach(tone => {
            try { tone.oscillator.stop(); } catch {}
          });
          this.tones = [];
        }

        play(type) {
          this.ensure();
          if (!this.context || options.muted) return;
          const now = this.context.currentTime;
          if (type === "hit" && now - this.lastHit < .055) return;
          if (type === "hit") this.lastHit = now;
          const presets = {
            hit: [180, 75, .07, "square"],
            kill: [360, 690, .11, "triangle"],
            playerHit: [150, 48, .2, "sawtooth"],
            level: [420, 920, .32, "sine"],
            card: [620, 1040, .18, "triangle"],
            evolution: [120, 1280, .72, "sawtooth"],
            boss: [68, 34, .75, "square"]
          };
          Object.assign(presets, {
            prism: [740, 1180, .08, "triangle"],
            lightning: [980, 210, .13, "square"],
            comet: [190, 52, .28, "sawtooth"],
            void: [96, 310, .3, "sine"],
            drone: [520, 780, .07, "square"],
            bloom: [440, 880, .2, "sine"]
          });
          if (presets[type] && !["hit", "kill", "playerHit", "level", "card", "evolution", "boss"].includes(type)) {
            if (now - this.lastSkill < .07) return;
            this.lastSkill = now;
          }
          const preset = presets[type] || presets.hit;
          const oscillator = this.context.createOscillator();
          const gain = this.context.createGain();
          oscillator.type = preset[3];
          oscillator.frequency.setValueAtTime(preset[0], now);
          oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, preset[1]), now + preset[2]);
          gain.gain.setValueAtTime(.0001, now);
          gain.gain.exponentialRampToValueAtTime(type === "evolution" ? .23 : .12, now + .012);
          gain.gain.exponentialRampToValueAtTime(.0001, now + preset[2]);
          oscillator.connect(gain);
          gain.connect(this.sfx);
          oscillator.start(now);
          oscillator.stop(now + preset[2] + .02);
        }
      }

      audio = new AudioEngine();

      function loadOptions() {
        try {
          return { reducedFx: false, screenShake: true, volume: .7, muted: false, quality: "auto", ...JSON.parse(localStorage.getItem(OPTIONS_KEY) || "{}") };
        } catch {
          return { reducedFx: false, screenShake: true, volume: .7, muted: false, quality: "auto" };
        }
      }

      function saveOptions() {
        localStorage.setItem(OPTIONS_KEY, JSON.stringify(options));
      }

      function loadAsset(key) {
        if (assets[key]) return Promise.resolve(assets[key]);
        if (assetLoads[key]) return assetLoads[key];
        const src = assetSources[key];
        assetLoads[key] = new Promise(resolve => {
          const image = new Image();
          image.decoding = "async";
          image.onload = async () => {
            const target = renderAssetSizes[key];
            if (target && "createImageBitmap" in window) {
              try {
                assets[key] = await createImageBitmap(image, {
                  resizeWidth: target[0],
                  resizeHeight: target[1],
                  resizeQuality: "high"
                });
              } catch {
                assets[key] = image;
              }
            } else {
              assets[key] = image;
            }
            resolve(assets[key]);
          };
          image.onerror = () => { assets[key] = null; resolve(null); };
          image.src = src;
        });
        return assetLoads[key];
      }

      function loadAssets(characterId = "nova") {
        const required = ["infiniteBackground", characterId, "hound", "charger", "xp"];
        return Promise.all(required.map(loadAsset));
      }
