      function showTitleModal(content, className = "") {
        overlayRoot.innerHTML = `<div class="overlay"><section class="modal center ${className}">${content}</section></div>`;
        gameScreen.hidden = false;
      }

      function closeTitleModal() {
        overlayRoot.innerHTML = "";
        if (!game) gameScreen.hidden = true;
      }

      function goTitle() {
        audio.stopMusic();
        game = null;
        cancelAnimationFrame(frameHandle);
        overlayRoot.innerHTML = "";
        gameScreen.hidden = true;
        titleScreen.hidden = false;
      }

      function updateHud() {
        if (!game) return;
        ui.level.textContent = game.level;
        ui.hp.textContent = `${Math.ceil(game.player.hp)} / ${game.player.maxHp}`;
        ui.hpBar.style.width = `${game.player.hp / game.player.maxHp * 100}%`;
        ui.xpBar.style.width = `${game.xp / game.xpNeed * 100}%`;
        const remaining = Math.max(0, RUN_TIME - game.elapsed);
        ui.timer.textContent = `${String(Math.floor(remaining / 60)).padStart(2, "0")}:${String(Math.floor(remaining % 60)).padStart(2, "0")}`;
        ui.sector.textContent = `${game.dangerActive ? "DANGER " : ""}SECTOR ${Math.floor(game.camera.x / 900)} · ${Math.floor(game.camera.y / 900)}`;
        ui.sector.style.color = game.dangerActive ? "#ff765c" : "";
        ui.score.textContent = formatNumber(game.score);
        ui.combo.hidden = game.combo < 1.12;
        const danger = game.dangerMultiplier > 1 ? " · DANGER x1.5" : "";
        ui.combo.innerHTML = `<small>OVERDRIVE · NO HIT x${game.noHitMultiplier.toFixed(2)}${danger}</small>x${game.combo.toFixed(1)}`;
        if (game.bossAlive) {
          ui.boss.hidden = false;
          const percent = Math.max(0, game.bossAlive.hp / game.bossAlive.maxHp * 100);
          ui.bossHp.style.width = `${percent}%`;
          ui.bossHpText.textContent = `${Math.ceil(percent)}%`;
        } else {
          ui.boss.hidden = true;
        }
      }

      function updateSkillRack() {
        if (!game) return;
        const chips = [];
        for (const [id, level] of Object.entries(game.skills)) {
          if (!level) continue;
          const def = skillDefs[id];
          chips.push(`<div class="skill-chip" title="${def.name}"><span>${def.icon}</span><small>${def.name}</small><b>LV.${level}</b></div>`);
        }
        for (const [id, level] of Object.entries(game.utilities)) {
          if (!level) continue;
          const def = utilityDefs[id];
          chips.push(`<div class="skill-chip" title="${def.name}"><span class="utility-art" style="${utilityArtStyle(id)}"></span><small>${def.name}</small><b>LV.${level}</b></div>`);
        }
        for (const [id, active] of Object.entries(game.evolutions)) {
          if (!active) continue;
          const def = evolutionDefs[id];
          chips.push(`<div class="skill-chip" title="${def.name}" style="border-color:#ffd56a"><span>${def.icon}</span><small>${def.name}</small><b>ULT</b></div>`);
        }
        for (const [id, active] of Object.entries(game.transcendences)) {
          if (!active) continue;
          const def = transcendDefs[id];
          chips.push(`<div class="skill-chip" title="${def.name}" style="border-color:#fff;box-shadow:0 0 18px ${def.color}55"><span>${def.icon}</span><small>${def.name}</small><b>TRANS</b></div>`);
        }
        ui.skills.innerHTML = chips.join("");
      }

      function render() {
        ctx.save();
        const shakeX = options.screenShake && shake > 0 ? (Math.random() - .5) * shake : 0;
        const shakeY = options.screenShake && shake > 0 ? (Math.random() - .5) * shake : 0;
        ctx.translate(shakeX, shakeY);
        drawBackground();
        drawSpeedLines();
        drawZones();
        drawStackField();
        drawOrbs();
        drawPickups();
        drawComets();
        drawEnemies();
        drawPlayer();
        drawDrones();
        drawPrism();
        drawEffects();
        drawParticles();
        drawEnergyOverlay();
        ctx.restore();

        if (screenFlash > 0) {
          ctx.fillStyle = `rgba(255,255,255,${Math.min(.45, screenFlash)})`;
          ctx.fillRect(0, 0, W, H);
        }
      }

      function drawBackground() {
        const image = assets.infiniteBackground || assets.background;
        if (image) {
          const tile = 640;
          const parallax = .68;
          const cameraX = game.camera.x * parallax;
          const cameraY = game.camera.y * parallax;
          const offsetX = -positiveMod(cameraX, tile);
          const offsetY = -positiveMod(cameraY, tile);
          const baseX = Math.floor(cameraX / tile);
          const baseY = Math.floor(cameraY / tile);
          for (let row = -1; row <= Math.ceil(H / tile) + 1; row++) {
            for (let column = -1; column <= Math.ceil(W / tile) + 1; column++) {
              const tileX = baseX + column;
              const tileY = baseY + row;
              const flipX = Math.abs(tileX) % 2 === 1;
              const flipY = Math.abs(tileY) % 2 === 1;
              const x = offsetX + column * tile;
              const y = offsetY + row * tile;
              ctx.save();
              ctx.translate(x + (flipX ? tile : 0), y + (flipY ? tile : 0));
              ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
              ctx.drawImage(image, 0, 0, tile, tile);
              ctx.restore();
            }
          }
        } else {
          const gradient = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, W * .7);
          gradient.addColorStop(0, "#171432");
          gradient.addColorStop(1, "#05040e");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, W, H);
        }
        ctx.fillStyle = "rgba(5,4,18,.27)";
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        const starCount = runtimeQuality === "low" ? 30 : runtimeQuality === "balanced" ? 52 : 78;
        for (let i = 0; i < (options.reducedFx ? Math.min(28, starCount) : starCount); i++) {
          const depth = .08 + (i % 5) * .055;
          const x = positiveMod(i * 197.3 - game.camera.x * depth, W + 100) - 50;
          const y = positiveMod(i * 113.7 - game.camera.y * depth, H + 100) - 50;
          const size = 1 + (i % 4) * .55;
          ctx.globalAlpha = .18 + (i % 5) * .08;
          ctx.fillStyle = i % 7 === 0 ? "#ff43cd" : i % 5 === 0 ? "#ffd56a" : "#7ff7ff";
          ctx.fillRect(x - size / 2, y - size / 2, size, size);
        }
        ctx.restore();
        if (game.evolutions.aurora || game.evolutions.supernova) {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          const color = game.evolutions.aurora && game.evolutions.supernova
            ? "rgba(255,126,234,.16)"
            : game.evolutions.aurora ? "rgba(78,244,255,.14)" : "rgba(255,67,205,.16)";
          const evolutionGlow = ctx.createRadialGradient(game.player.x, game.player.y, 30, game.player.x, game.player.y, 620);
          evolutionGlow.addColorStop(0, color);
          evolutionGlow.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = evolutionGlow;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
        if (game.dangerMultiplier > 1) {
          const edge = ctx.createRadialGradient(W / 2, H / 2, 250, W / 2, H / 2, 690);
          edge.addColorStop(.7, "rgba(0,0,0,0)");
          edge.addColorStop(1, "rgba(255,73,60,.28)");
          ctx.fillStyle = edge;
          ctx.fillRect(0, 0, W, H);
        }
        const vignette = ctx.createRadialGradient(W / 2, H / 2, 140, W / 2, H / 2, 720);
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(0,0,0,.47)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);
      }

      function drawSpeedLines() {
        if (!game.player.moving || options.reducedFx || runtimeQuality === "low") return;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const color = game.character === "bolt" ? "255,213,106" : game.character === "eclipse" ? "255,67,205" : "78,244,255";
        const lineCount = runtimeQuality === "balanced" ? 10 : 18;
        for (let i = 0; i < lineCount; i++) {
          const angle = (i * 2.399 + game.elapsed * .35) % (Math.PI * 2);
          const inner = 100 + (i % 5) * 38;
          const length = 20 + (i % 4) * 18;
          const alpha = .05 + (i % 3) * .035;
          ctx.strokeStyle = `rgba(${color},${alpha})`;
          ctx.lineWidth = 1 + (i % 2);
          ctx.beginPath();
          ctx.moveTo(game.player.x + Math.cos(angle) * inner, game.player.y + Math.sin(angle) * inner);
          ctx.lineTo(game.player.x + Math.cos(angle) * (inner + length), game.player.y + Math.sin(angle) * (inner + length));
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawEnergyOverlay() {
        const stackIntensity = Math.max(0, totalSkillLevels() - 3) / 24;
        const intensity = Math.max(0, (game.combo - 2) / 8)
          + Object.values(game.evolutions).filter(Boolean).length * .2
          + Object.values(game.transcendences).filter(Boolean).length * .12
          + stackIntensity;
        if (intensity <= 0 || options.reducedFx || runtimeQuality === "low") return;
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.translate(game.player.x, game.player.y);
        ctx.rotate(game.elapsed * .08);
        const rayCount = runtimeQuality === "balanced" ? 6 : 12;
        for (let ray = 0; ray < rayCount; ray++) {
          ctx.rotate(Math.PI * 2 / rayCount);
          const gradient = ctx.createLinearGradient(42, 0, 620, 0);
          gradient.addColorStop(0, `rgba(255,255,255,${.015 * intensity})`);
          gradient.addColorStop(.35, `rgba(78,244,255,${.025 * intensity})`);
          gradient.addColorStop(1, "rgba(255,67,205,0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.moveTo(42, -5);
          ctx.lineTo(620, -28);
          ctx.lineTo(620, 28);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStackField() {
        const activeSkills = Object.entries(game.skills).filter(([, level]) => level > 0);
        const stacks = totalSkillLevels();
        if (stacks < 3 || options.reducedFx) return;
        const colors = activeSkills.map(([id]) => skillDefs[id].color);
        const ringCount = Math.min(runtimeQuality === "low" ? 2 : 5, 1 + Math.floor(stacks / 5));
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.translate(game.player.x, game.player.y);
        for (let ring = 0; ring < ringCount; ring++) {
          const radius = 96 + ring * 24 + Math.sin(game.elapsed * (2.4 + ring * .3)) * 7;
          ctx.save();
          ctx.rotate(game.elapsed * (ring % 2 ? -.35 : .28) + ring);
          ctx.strokeStyle = hexToRgba(colors[ring % colors.length] || "#4ef4ff", .2 + stacks * .006);
          ctx.lineWidth = 2 + Math.min(3, stacks / 12);
          ctx.setLineDash([12 + ring * 3, 9]);
          ctx.lineDashOffset = game.elapsed * (ring % 2 ? 34 : -38);
          ctx.shadowColor = colors[ring % colors.length] || "#4ef4ff";
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.stroke();
          const nodes = Math.min(8, 2 + Math.floor(stacks / 4));
          ctx.setLineDash([]);
          for (let node = 0; node < nodes; node++) {
            const angle = node / nodes * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            ctx.fillStyle = node % 2 ? "#ffffff" : colors[(ring + node) % colors.length];
            ctx.beginPath();
            ctx.arc(x, y, 2.5 + (node % 3), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
        ctx.restore();
      }

      function drawPlayer() {
        const p = game.player;
        const playerImage = assets[game.character] || assets.player;
        if (playerImage && p.moving && !options.reducedFx) {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          for (let trail = 4; trail >= 1; trail--) {
            const alpha = (5 - trail) * .035;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(p.x - p.moveX * trail * 11, p.y - p.moveY * trail * 9);
            ctx.rotate(p.lean * .7);
            ctx.scale(p.facing * (1 - trail * .025), 1 - trail * .025);
            ctx.shadowColor = game.character === "bolt" ? "#ffd56a" : game.character === "eclipse" ? "#ff43cd" : "#4ef4ff";
            ctx.shadowBlur = 20;
            ctx.drawImage(playerImage, -45, -62, 90, 90);
            ctx.restore();
          }
          ctx.restore();
        }
        ctx.save();
        const bob = p.moving ? Math.sin(game.elapsed * 15) * 3 : Math.sin(game.elapsed * 4) * 1.5;
        ctx.translate(p.x, p.y + bob);
        ctx.rotate(p.lean);
        if (p.hitCooldown > 0 && Math.floor(p.hitCooldown * 14) % 2 === 0) ctx.globalAlpha = .48;
        const pulse = 1 + Math.sin(game.elapsed * 4) * .025;
        const runStretch = p.moving ? 1 + Math.sin(game.elapsed * 15) * .045 : 1;
        ctx.scale(p.facing * pulse * runStretch, pulse / runStretch);
        ctx.shadowColor = p.hitCooldown > 0 ? "#ff557f" : "#4ef4ff";
        ctx.shadowBlur = p.hitCooldown > 0 ? 30 : 18;
        if (playerImage) {
          ctx.drawImage(playerImage, -45, -62, 90, 90);
        } else {
          ctx.fillStyle = "#4ef4ff";
          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        if (game.combo >= 2) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const layers = Math.min(4, Math.floor(game.combo / 2));
          for (let i = 0; i < layers; i++) {
            ctx.strokeStyle = i % 2 ? `rgba(255,67,205,${.2 + i * .04})` : `rgba(78,244,255,${.25 + i * .04})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 34 + i * 9 + Math.sin(game.elapsed * 7 + i) * 4, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }

        if (game.evolutions.aurora || game.evolutions.supernova) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = game.evolutions.aurora ? "rgba(255,213,106,.5)" : "rgba(255,67,205,.5)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 40 + Math.sin(game.elapsed * 5) * 6, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        if (p.magnetTimer > 0) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = `rgba(78,244,255,${.38 + Math.sin(game.elapsed * 8) * .12})`;
          ctx.lineWidth = 3;
          ctx.setLineDash([12, 8]);
          ctx.lineDashOffset = -game.elapsed * 90;
          ctx.shadowColor = "#4ef4ff";
          ctx.shadowBlur = qualityShadow(24);
          ctx.beginPath();
          ctx.arc(p.x, p.y, 68 + Math.sin(game.elapsed * 7) * 7, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawEnemies() {
        const crowdMode = game.entities.enemies.length > 170;
        for (const enemy of game.entities.enemies) {
          if (!isVisible(enemy, enemy.boss ? 190 : 100)) continue;
          const image = enemy.boss ? assets.boss
            : enemy.type === "charger" ? assets.charger
            : enemy.type === "hound" ? assets.hound : null;
          const angle = Math.atan2(game.player.y - enemy.y, game.player.x - enemy.x) + Math.PI / 2;
          const stride = Math.sin(enemy.phase * (enemy.boss ? 1.4 : 2.2));
          const dashing = (enemy.type === "charger" && enemy.dashClock < .38)
            || (enemy.type === "shard" && enemy.dashClock < .2);
          ctx.save();
          ctx.translate(enemy.x, enemy.y + Math.sin(enemy.phase) * (enemy.boss ? 8 : 3));
          ctx.rotate(angle + (enemy.boss ? Math.sin(enemy.phase) * .04 : stride * .055));
          ctx.shadowColor = enemy.boss ? "#ff43cd" : enemy.color || (enemy.type === "charger" ? "#ff765c" : "#9c5cff");
          ctx.shadowBlur = enemy.boss ? qualityShadow(30)
            : crowdMode ? 0 : qualityShadow(enemy.procedural ? 18 : 10);
          if (enemy.procedural) {
            drawProceduralEnemy(enemy, dashing, crowdMode);
          } else if (image) {
            if (dashing && !crowdMode && !options.reducedFx && runtimeQuality !== "low") {
              for (let trail = 3; trail >= 1; trail--) {
                ctx.globalAlpha = .07 * (4 - trail);
                ctx.drawImage(image, -enemy.size / 2, -enemy.size / 2 + trail * 18, enemy.size, enemy.size);
              }
              ctx.globalAlpha = 1;
            }
            const stretch = enemy.boss
              ? 1 + Math.sin(game.elapsed * 2.4 + enemy.phase) * .055
              : dashing ? 1.22 : 1 + stride * .075;
            ctx.scale(1 / stretch, stretch);
            ctx.drawImage(image, -enemy.size / 2, -enemy.size / 2, enemy.size, enemy.size);
          } else {
            ctx.fillStyle = enemy.boss ? "#9c5cff" : "#ff43cd";
            ctx.beginPath();
            ctx.arc(0, 0, enemy.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          if (enemy.elite) {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = "rgba(255,213,106,.72)";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([7, 6]);
            ctx.lineDashOffset = game.elapsed * 28;
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.r + 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          if (enemy.boss) {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = `rgba(255,67,205,${.25 + Math.sin(game.elapsed * 3) * .08})`;
            ctx.lineWidth = 4;
            ctx.setLineDash([18, 12]);
            ctx.lineDashOffset = game.elapsed * 45;
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.r + 28 + Math.sin(game.elapsed * 2.2) * 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          if (enemy.boss || (!crowdMode && enemy.hp < enemy.maxHp)) {
            const width = enemy.boss ? 120 : 42;
            ctx.fillStyle = "rgba(0,0,0,.68)";
            ctx.fillRect(enemy.x - width / 2, enemy.y - enemy.size * .43, width, 5);
            ctx.fillStyle = enemy.boss ? "#ff43cd" : "#6affc1";
            ctx.fillRect(enemy.x - width / 2, enemy.y - enemy.size * .43, width * Math.max(0, enemy.hp / enemy.maxHp), 5);
          }
        }
      }

      function drawProceduralEnemy(enemy, dashing, crowdMode = false) {
        const size = enemy.size;
        const color = enemy.color;
        const pulse = 1 + Math.sin(enemy.phase * 2.2) * .09;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        if (dashing && !crowdMode && !options.reducedFx && runtimeQuality !== "low") {
          for (let trail = 3; trail >= 1; trail--) {
            ctx.globalAlpha = .08 * (4 - trail);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -size * .48 + trail * 15);
            ctx.lineTo(size * .24, size * .2 + trail * 15);
            ctx.lineTo(0, size * .08 + trail * 15);
            ctx.lineTo(-size * .24, size * .2 + trail * 15);
            ctx.closePath();
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
        ctx.scale(pulse, pulse);
        if (enemy.type === "shard") {
          if (crowdMode) {
            ctx.fillStyle = color;
          } else {
            const gradient = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
            gradient.addColorStop(0, "#ffffff");
            gradient.addColorStop(.38, color);
            gradient.addColorStop(1, "#5848ff");
            ctx.fillStyle = gradient;
          }
          ctx.beginPath();
          ctx.moveTo(0, -size * .52);
          ctx.lineTo(size * .3, size * .12);
          ctx.lineTo(0, size * .42);
          ctx.lineTo(-size * .3, size * .12);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (enemy.type === "sentinel") {
          ctx.rotate(enemy.phase * .4 * enemy.turn);
          ctx.fillStyle = "rgba(25,18,70,.92)";
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          polygonPath(6, size * .38);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(0, 0, size * .12, 0, Math.PI * 2);
          ctx.fill();
          for (let node = 0; node < (crowdMode ? 1 : 3); node++) {
            const a = enemy.phase * 1.5 + node / 3 * Math.PI * 2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * size * .5, Math.sin(a) * size * .5, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (enemy.type === "bulwark") {
          ctx.rotate(Math.sin(enemy.phase) * .08);
          ctx.fillStyle = "rgba(45,35,36,.96)";
          ctx.strokeStyle = color;
          ctx.lineWidth = 5;
          polygonPath(8, size * .43);
          ctx.fill();
          ctx.stroke();
          ctx.rotate(Math.PI / 8);
          ctx.strokeStyle = "#fff3b0";
          ctx.lineWidth = 2;
          polygonPath(4, size * .25);
          ctx.stroke();
          ctx.fillStyle = "#ff765c";
          ctx.beginPath();
          ctx.arc(0, 0, size * .105, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.rotate(enemy.phase * 1.2 * enemy.turn);
          for (let wing = 0; wing < 3; wing++) {
            ctx.rotate(Math.PI * 2 / 3);
            if (crowdMode) {
              ctx.fillStyle = color;
            } else {
              const gradient = ctx.createLinearGradient(0, 0, 0, -size * .52);
              gradient.addColorStop(0, "#ffffff");
              gradient.addColorStop(1, color);
              ctx.fillStyle = gradient;
            }
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(size * .18, -size * .12);
            ctx.lineTo(0, -size * .52);
            ctx.lineTo(-size * .18, -size * .12);
            ctx.closePath();
            ctx.fill();
          }
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(0, 0, size * .1, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function polygonPath(sides, radius) {
        ctx.beginPath();
        for (let side = 0; side < sides; side++) {
          const angle = -Math.PI / 2 + side / sides * Math.PI * 2;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          if (side === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      function drawDrones() {
        const level = game.skills.drone;
        if (!level) return;
        const count = Math.min(12, (level >= 4 ? 3 : level >= 2 ? 2 : 1)
          + Math.ceil(projectileBonus() / 2)
          + (game.transcendences.seraphSquadron ? 4 : 0)
          + (game.transcendences.omegaArray ? 2 : 0));
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let index = 0; index < count; index++) {
          const angle = game.elapsed * 2.2 + index / count * Math.PI * 2;
          const x = game.player.x + Math.cos(angle) * 82;
          const y = game.player.y + Math.sin(angle) * 56;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle + game.elapsed * 4);
          ctx.shadowColor = "#6affc1";
          ctx.shadowBlur = 20;
          ctx.fillStyle = "#eafff6";
          ctx.beginPath();
          ctx.moveTo(0, -13);
          ctx.lineTo(11, 9);
          ctx.lineTo(0, 5);
          ctx.lineTo(-11, 9);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function drawPrism() {
        const level = game.skills.prism;
        if (!level) return;
        const count = (level >= 2 ? 2 : 1) + (level >= 4 ? 2 : 0)
          + (game.evolutions.aurora ? 4 : 0) + projectileBonus()
          + (game.transcendences.infiniteEdge ? 6 : 0)
          + (game.transcendences.chronoPhantom ? 2 : 0);
        const radius = (62 + level * 10 + (game.evolutions.aurora ? 32 : 0)
          + (game.transcendences.infiniteEdge ? 35 : 0)) * areaScale();
        const time = game.elapsed * (1.7 + level * .12) * (1 + game.utilities.attackSpeed * .12);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let blade = 0; blade < count; blade++) {
          const angle = time + blade / count * Math.PI * 2;
          const bx = game.player.x + Math.cos(angle) * radius;
          const by = game.player.y + Math.sin(angle) * radius * .72;
          ctx.save();
          ctx.translate(bx, by);
          ctx.rotate(angle + Math.PI / 2);
          ctx.shadowColor = game.evolutions.aurora ? "#ffd56a" : level >= 5 ? "#ff43cd" : "#4ef4ff";
          ctx.shadowBlur = game.evolutions.aurora ? 25 : 16;
          const gradient = ctx.createLinearGradient(0, -24, 0, 24);
          gradient.addColorStop(0, "#ffffff");
          gradient.addColorStop(.35, game.evolutions.aurora ? "#ffd56a" : "#4ef4ff");
          gradient.addColorStop(1, level >= 5 ? "#ff43cd" : "#695cff");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.moveTo(0, -24 - level * 2);
          ctx.lineTo(9 + level, 8);
          ctx.lineTo(0, 16);
          ctx.lineTo(-9 - level, 8);
          ctx.closePath();
          ctx.fill();
          if (level >= 3) {
            ctx.globalAlpha = level >= 5 ? .38 : .22;
            const trailCount = level >= 5 ? 4 : 2;
            for (let trail = 1; trail <= trailCount; trail++) {
              ctx.rotate(-.12);
              ctx.scale(.92, .92);
              ctx.fill();
            }
          }
          ctx.restore();
        }
        ctx.restore();
      }

      function drawPickups() {
        for (const pickup of game.entities.pickups) {
          if (!isVisible(pickup, 50)) continue;
          const pulse = 1 + Math.sin(pickup.phase * 2.2) * .08;
          const color = pickup.type === "heal" ? "#6affc1" : "#4ef4ff";
          ctx.save();
          ctx.translate(pickup.x, pickup.y + Math.sin(pickup.phase * 2.6) * 4);
          ctx.scale(pulse, pulse);
          ctx.globalCompositeOperation = "lighter";
          ctx.shadowColor = color;
          ctx.shadowBlur = qualityShadow(24);
          ctx.fillStyle = "rgba(8,10,30,.88)";
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          polygonPath(6, 22);
          ctx.fill();
          ctx.stroke();
          if (pickup.type === "heal") {
            ctx.fillStyle = "#eafff6";
            ctx.fillRect(-5, -14, 10, 28);
            ctx.fillRect(-14, -5, 28, 10);
            ctx.strokeStyle = "rgba(106,255,193,.55)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 29 + Math.sin(pickup.phase * 3) * 3, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.strokeStyle = "#e9ffff";
            ctx.lineWidth = 7;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.arc(0, -1, 11, 0, Math.PI);
            ctx.lineTo(-11, 11);
            ctx.moveTo(11, -1);
            ctx.lineTo(11, 11);
            ctx.stroke();
            ctx.strokeStyle = "#ffd56a";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-11, 7);
            ctx.lineTo(-11, 13);
            ctx.moveTo(11, 7);
            ctx.lineTo(11, 13);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawOrbs() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const orb of game.entities.orbs) {
          if (!isVisible(orb, 35)) continue;
          const pulse = 4 + Math.sin(game.elapsed * 6 + orb.phase) * 1.4;
          ctx.shadowColor = "#4ef4ff";
          ctx.shadowBlur = qualityShadow(14);
          if (assets.xp) {
            const size = 17 + pulse;
            ctx.save();
            ctx.translate(orb.x, orb.y);
            ctx.rotate(Math.sin(game.elapsed * 2.8 + orb.phase) * .22);
            ctx.scale(1 + Math.sin(game.elapsed * 5 + orb.phase) * .08, 1 - Math.sin(game.elapsed * 5 + orb.phase) * .05);
            ctx.drawImage(assets.xp, -size / 2, -size / 2, size, size);
            ctx.restore();
          } else {
            ctx.fillStyle = "#a7fbff";
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, pulse, 0, Math.PI * 2);
            ctx.fill();
          }
          if (orb.ambient) {
            ctx.strokeStyle = "rgba(106,255,193,.42)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, 13 + Math.sin(game.elapsed * 3 + orb.phase) * 2, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawComets() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const comet of game.entities.comets) {
          const p = clamp(comet.progress, 0, 1);
          const cx = comet.x + (1 - p) * 150;
          const cy = comet.y - (1 - p) * 260;
          if (!isVisible({ x: cx, y: cy }, 160) && !isVisible(comet, 100)) continue;
          const color = game.evolutions.supernova ? "#ff43cd" : "#ff8a5c";
          ctx.strokeStyle = color;
          ctx.lineWidth = 8;
          ctx.shadowColor = color;
          ctx.shadowBlur = qualityShadow(25);
          const tails = comet.level >= 5 ? 4 : comet.level >= 3 ? 3 : comet.level >= 2 ? 2 : 1;
          for (let tail = 0; tail < tails; tail++) {
            ctx.globalAlpha = 1 - tail * .18;
            ctx.lineWidth = 8 - tail;
            ctx.beginPath();
            ctx.moveTo(cx + 70 + tail * 14, cy - 105 - tail * 8);
            ctx.lineTo(cx + tail * 3, cy - tail * 2);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(cx, cy, comet.size * (.55 + p * .45), 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = `${color}88`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(comet.x, comet.y, 18 + p * 20, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawZones() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const zone of game.entities.zones) {
          if (!isVisible(zone, zone.r + 30)) continue;
          const alpha = Math.min(.5, zone.life / zone.maxLife);
          const gradient = ctx.createRadialGradient(zone.x, zone.y, 0, zone.x, zone.y, zone.r);
          if (zone.type === "fire") {
            gradient.addColorStop(0, `rgba(255,213,106,${alpha})`);
            gradient.addColorStop(.55, `rgba(255,80,92,${alpha * .7})`);
          } else {
            gradient.addColorStop(0, `rgba(78,244,255,${alpha})`);
            gradient.addColorStop(.55, `rgba(156,92,255,${alpha * .7})`);
          }
          gradient.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(zone.x, zone.y, zone.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawEffects() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const effect of game.entities.effects) {
          if (!isEffectVisible(effect)) continue;
          const t = 1 - effect.life / effect.maxLife;
          if (effect.type === "lightning" || effect.type === "droneLaser") {
            const skillLevel = effect.type === "lightning" ? game.skills.lightning : game.skills.drone;
            const fullPasses = skillLevel >= 5 ? 3 : skillLevel >= 3 ? 2 : 1;
            const passes = runtimeQuality === "low" ? 1 : runtimeQuality === "balanced" ? Math.min(2, fullPasses) : fullPasses;
            ctx.shadowColor = effect.color;
            ctx.shadowBlur = qualityShadow(18 + skillLevel * 3);
            for (let pass = passes; pass >= 1; pass--) {
              ctx.globalAlpha = pass === 1 ? 1 : .22;
              ctx.strokeStyle = pass === 1 ? effect.color : "#ffffff";
              ctx.lineWidth = effect.width * (effect.life / effect.maxLife) * (1 + pass * .42);
              for (let p = 0; p < effect.points.length - 1; p++) {
                drawLightning(effect.points[p], effect.points[p + 1]);
              }
            }
            ctx.globalAlpha = 1;
          } else if (effect.type === "pulse") {
            ctx.strokeStyle = effect.color;
            ctx.lineWidth = 9 * (1 - t);
            ctx.shadowColor = effect.color;
            ctx.shadowBlur = qualityShadow(24);
            const ringCap = runtimeQuality === "low" ? 1 : runtimeQuality === "balanced" ? 2 : 4;
            const rings = Math.min(ringCap, 1 + Math.floor(game.skills.void / 2));
            for (let ring = 0; ring < rings; ring++) {
              const ringT = clamp(t - ring * .08, 0, 1);
              ctx.globalAlpha = 1 - ring * .16;
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, effect.r * ringT, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          } else if (effect.type === "explosion") {
            const radius = effect.r * Math.sin(Math.min(1, t) * Math.PI / 2);
            const gradient = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
            gradient.addColorStop(0, `rgba(255,255,255,${.85 * (1 - t)})`);
            gradient.addColorStop(.25, hexToRgba(effect.color, .68 * (1 - t)));
            gradient.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = hexToRgba(effect.color, .72 * (1 - t));
            ctx.lineWidth = 5 * (1 - t);
            const explosionRings = runtimeQuality === "low" ? 1 : runtimeQuality === "balanced" ? 2 : 3;
            for (let ring = 0; ring < explosionRings; ring++) {
              ctx.beginPath();
              ctx.arc(effect.x, effect.y, radius * (.55 + ring * .22), 0, Math.PI * 2);
              ctx.stroke();
            }
          } else if (effect.type === "bloom") {
            ctx.save();
            ctx.translate(effect.x, effect.y);
            ctx.rotate(t * Math.PI);
            ctx.shadowColor = effect.color;
            ctx.shadowBlur = qualityShadow(28);
            const petalScale = runtimeQuality === "low" ? .5 : runtimeQuality === "balanced" ? .75 : 1;
            const petals = Math.max(6, Math.round((8 + (effect.level || 1) * 2) * petalScale));
            for (let petal = 0; petal < petals; petal++) {
              ctx.rotate(Math.PI * 2 / petals);
              ctx.fillStyle = hexToRgba(effect.color, .7 * (1 - t));
              ctx.beginPath();
              ctx.ellipse(0, effect.r * t * .55, effect.r * .18, effect.r * .5 * t, 0, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }
        ctx.restore();
      }

      function drawLightning(a, b) {
        const segments = options.reducedFx || runtimeQuality === "low" ? 4 : runtimeQuality === "balanced" ? 6 : 8;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        for (let i = 1; i < segments; i++) {
          const t = i / segments;
          const x = a.x + (b.x - a.x) * t + (Math.random() - .5) * 24;
          const y = a.y + (b.y - a.y) * t + (Math.random() - .5) * 24;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawParticles() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const particle of game.entities.particles) {
          if (!isVisible(particle, 30)) continue;
          ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
          ctx.fillStyle = particle.color;
          ctx.shadowColor = particle.color;
          ctx.shadowBlur = qualityShadow(8);
          ctx.fillRect(particle.x - particle.size / 2, particle.y - particle.size / 2, particle.size, particle.size);
        }
        ctx.restore();
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
      }

      function setupJoystick() {
        const base = document.getElementById("joystick");
        const stick = document.getElementById("stick");
        let pointerId = null;
        function move(event) {
          if (event.pointerId !== pointerId) return;
          const rect = base.getBoundingClientRect();
          let dx = event.clientX - (rect.left + rect.width / 2);
          let dy = event.clientY - (rect.top + rect.height / 2);
          const distance = Math.hypot(dx, dy);
          const max = rect.width * .32;
          if (distance > max) {
            dx = dx / distance * max;
            dy = dy / distance * max;
          }
          const clampedDistance = Math.min(distance, max);
          const rawStrength = clampedDistance / max;
          const strength = rawStrength < .04 ? 0 : Math.pow((rawStrength - .04) / .96, .72);
          const directionLength = Math.hypot(dx, dy) || 1;
          touchMove.x = dx / directionLength * strength;
          touchMove.y = dy / directionLength * strength;
          stick.style.transform = `translate(${dx}px, ${dy}px)`;
        }
        base.addEventListener("pointerdown", event => {
          event.preventDefault();
          pointerId = event.pointerId;
          base.setPointerCapture(pointerId);
          touchMove.active = true;
          base.classList.add("active");
          if (navigator.vibrate) navigator.vibrate(12);
          move(event);
        });
        base.addEventListener("pointermove", move);
        function end(event) {
          if (event.pointerId !== pointerId) return;
          pointerId = null;
          touchMove.x = 0;
          touchMove.y = 0;
          touchMove.active = false;
          base.classList.remove("active");
          stick.style.transform = "";
        }
        base.addEventListener("pointerup", end);
        base.addEventListener("pointercancel", end);
      }

      function handleNumeric(key) {
        const number = Number(key);
        if (game && game.mode === "levelup") return selectCard(number - 1);
        const visibleCharacter = overlayRoot.querySelectorAll("[data-character]")[number - 1];
        if (visibleCharacter) return visibleCharacter.click();
        const visibleAction = overlayRoot.querySelector(`[data-action]:nth-of-type(${number})`);
        if (visibleAction) return visibleAction.click();
        if (!titleScreen.hidden) {
          const menu = titleScreen.querySelector(`[data-menu="${number === 1 ? "start" : number === 2 ? "how" : number === 3 ? "options" : ""}"]`);
          if (menu) menu.click();
        }
      }

      document.addEventListener("keydown", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
        if (/^[1-3]$/.test(event.key)) {
          event.preventDefault();
          handleNumeric(event.key);
          return;
        }
        if (event.key === "Escape") {
          event.preventDefault();
          if (game) togglePause();
          else closeTitleModal();
          return;
        }
        keys.add(key);
      });

      document.addEventListener("keyup", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && game && game.mode === "playing") togglePause();
      });

      document.addEventListener("click", event => {
        const menu = event.target.closest("[data-menu]");
        if (menu) {
          const action = menu.dataset.menu;
          if (action === "start") showCharacterSelect();
          if (action === "how") showInfo();
          if (action === "options") showOptions();
          return;
        }
        const character = event.target.closest("[data-character]");
        if (character) return startGame(character.dataset.character);
        const card = event.target.closest("[data-card]");
        if (card) return selectCard(Number(card.dataset.card));
        const toggle = event.target.closest("[data-toggle]");
        if (toggle) {
          options[toggle.dataset.toggle] = !options[toggle.dataset.toggle];
          saveOptions();
          audio.applyOptions();
          showOptions();
          return;
        }
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "continue-evolution") continueEvolution();
        if (action === "resume") togglePause();
        if (action === "restart") startGame();
        if (action === "quit") goTitle();
        if (action === "close-title") closeTitleModal();
      });

      document.addEventListener("input", event => {
        if (!event.target.matches("[data-volume]")) return;
        options.volume = Number(event.target.value) / 100;
        saveOptions();
        audio.ensure();
        audio.applyOptions();
      });

      document.addEventListener("change", event => {
        if (!event.target.matches("[data-quality]")) return;
        options.quality = event.target.value;
        runtimeQuality = resolveQuality();
        enforceQualityCaps();
        saveOptions();
        showToast(`그래픽 품질: ${qualityLabel(runtimeQuality)}`);
      });

      document.getElementById("pauseButton").addEventListener("click", togglePause);
      setupJoystick();

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function positiveMod(value, divisor) { return ((value % divisor) + divisor) % divisor; }
      function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function isVisible(entity, margin = 80) {
        return entity && entity.x >= -margin && entity.x <= W + margin
          && entity.y >= -margin && entity.y <= H + margin;
      }
      function isEffectVisible(effect) {
        if (effect.points) return effect.points.some(point => isVisible(point, 100));
        return isVisible(effect, Math.max(100, effect.r || 0));
      }
      function qualityShadow(amount) {
        if (runtimeQuality === "low") return 0;
        return runtimeQuality === "balanced" ? amount * .5 : amount;
      }
      function xpNeedForLevel(level) {
        if (level < 10) return Math.floor(10 + level * 1.5);
        if (level < 25) return 24 + (level - 10) * 2;
        if (level < 50) return 55 + (level - 25) * 3;
        if (level < 60) return 150 + (level - 50) * 20;
        if (level < 70) return 360 + (level - 60) * 55;
        return 900 + (level - 70) * 110;
      }
      function targetLevelAtTime(seconds) {
        if (seconds <= 150) return 1 + seconds / 3;
        return 51 + (seconds - 150) / 22;
      }
      function progressionRate(level, seconds) {
        if (level >= 50) return 1;
        const earlyBoost = level < 10 ? 1.45 : level < 25 ? 1.3 : 1.15;
        const gap = targetLevelAtTime(seconds) - level;
        const catchUp = gap > 8 ? 2.4 : gap > 4 ? 1.8 : gap > 1 ? 1.35 : 1;
        return earlyBoost * catchUp;
      }
      function enemyHpMultiplier(level, seconds = 0) {
        const safeLevel = Math.max(1, level);
        let levelScale = enemyHpLevelAnchors[enemyHpLevelAnchors.length - 1][1];
        for (let index = 0; index < enemyHpLevelAnchors.length - 1; index++) {
          const [startLevel, startScale] = enemyHpLevelAnchors[index];
          const [endLevel, endScale] = enemyHpLevelAnchors[index + 1];
          if (safeLevel > endLevel) continue;
          const progress = clamp((safeLevel - startLevel) / (endLevel - startLevel), 0, 1);
          levelScale = startScale + (endScale - startScale) * progress;
          break;
        }
        const timeScale = 1 + Math.min(1.2, seconds / 250);
        return levelScale * timeScale;
      }
      function rebalanceExistingEnemies(level) {
        if (!game) return;
        const targetScale = enemyHpMultiplier(level, game.elapsed);
        for (const enemy of game.entities.enemies) {
          const previousScale = enemy.durabilityScale || 1;
          if (targetScale <= previousScale * 1.01) continue;
          const ratio = targetScale / previousScale;
          enemy.maxHp *= ratio;
          enemy.hp = Math.max(enemy.hp * ratio, enemy.maxHp * .35);
          enemy.durabilityScale = targetScale;
        }
      }
      function enemyPressureForLevel(level) {
        const tier = enemyPressureTable.find(row => level >= row.min && level <= row.max)
          || enemyPressureTable[enemyPressureTable.length - 1];
        const step = Math.max(0, level - tier.min);
        return { ...tier, target: Math.min(450, tier.start + step * tier.perLevel) };
      }
      function effectiveEnemyTarget(level) {
        const rawTarget = enemyPressureForLevel(level).target;
        const qualityScale = runtimeQuality === "low" ? .4 : runtimeQuality === "balanced" ? .68 : 1;
        return Math.min(enemyLimit(), Math.max(12, Math.ceil(rawTarget * qualityScale)));
      }
      function spawnLevelReinforcements(level) {
        if (!game) return 0;
        const pressure = enemyPressureForLevel(level);
        const available = Math.max(0, enemyLimit() - game.entities.enemies.length);
        const count = Math.min(pressure.reinforcements, available);
        for (let i = 0; i < count; i++) {
          spawnEnemy(Math.random() < Math.min(.24, level / 260));
        }
        return count;
      }
      function enemyLimit(level = runtimeQuality) {
        return level === "low" ? 180 : level === "balanced" ? 300 : 450;
      }
      function enforceQualityCaps() {
        if (!game) return;
        const limit = enemyLimit();
        const enemies = game.entities.enemies;
        if (enemies.length > limit) {
          const bosses = enemies.filter(enemy => enemy.boss);
          const regular = enemies.filter(enemy => !enemy.boss);
          regular.sort((a, b) => {
            const adx = a.x - game.player.x;
            const ady = a.y - game.player.y;
            const bdx = b.x - game.player.x;
            const bdy = b.y - game.player.y;
            return adx * adx + ady * ady - (bdx * bdx + bdy * bdy);
          });
          game.entities.enemies = bosses.concat(regular.slice(0, Math.max(0, limit - bosses.length)));
        }
        const orbLimit = runtimeQuality === "low" ? 58 : runtimeQuality === "balanced" ? 74 : 90;
        if (game.entities.orbs.length > orbLimit) {
          game.entities.orbs.splice(0, game.entities.orbs.length - orbLimit);
        }
        const particleLimit = runtimeQuality === "low" ? 120 : runtimeQuality === "balanced" ? 230 : 380;
        if (game.entities.particles.length > particleLimit) {
          game.entities.particles.splice(0, game.entities.particles.length - particleLimit);
        }
      }
      function totalSkillLevels() { return Object.values(game.skills).reduce((sum, level) => sum + level, 0); }
      function projectileBonus() {
        return game.utilities.projectile
          + (game.transcendences.omegaArray ? 3 : 0);
      }
      function areaScale() { return 1 + game.utilities.area * .1; }
      function attackSpeedScale() { return 1 / (1 + game.utilities.attackSpeed * .12); }
      function nearestEnemies(count) {
        return [...game.entities.enemies]
          .sort((a, b) => distance(a, game.player) - distance(b, game.player))
          .slice(0, count);
      }
      function transcendRequirementMet(definition) {
        const requiredSkills = Object.entries(definition.requires?.skills || {});
        const requiredUtilities = Object.entries(definition.requires?.utilities || {});
        return requiredSkills.every(([id, level]) => game.skills[id] >= level)
          && requiredUtilities.every(([id, level]) => game.utilities[id] >= level);
      }
      function resolveQuality() {
        if (options.quality && options.quality !== "auto") return options.quality;
        const memory = Number(navigator.deviceMemory || 8);
        const cores = Number(navigator.hardwareConcurrency || 8);
        if (memory <= 4 || cores <= 4) return "low";
        if (memory <= 8 || cores <= 6) return "balanced";
        return "high";
      }
      function qualityLabel(level) {
        return level === "high" ? "화려함 우선" : level === "balanced" ? "균형" : "저사양";
      }
      function monitorPerformance(dt) {
        if (!game || options.quality !== "auto" || dt <= 0) return;
        const perf = game.performance;
        perf.frames += 1;
        perf.total += dt;
        perf.slowFrames = dt > .03 ? perf.slowFrames + 1 : Math.max(0, perf.slowFrames - 2);
        const sustainedStall = perf.slowFrames >= 18;
        if (perf.frames < 90 && !sustainedStall) return;
        const average = perf.total / perf.frames;
        perf.frames = 0;
        perf.total = 0;
        perf.slowFrames = 0;
        if ((average > .0235 || sustainedStall) && runtimeQuality !== "low") {
          runtimeQuality = runtimeQuality === "high" ? "balanced" : "low";
          enforceQualityCaps();
          if (!perf.warned) {
            perf.warned = true;
            showToast(`프레임 보호: ${qualityLabel(runtimeQuality)} 모드`);
          }
        }
      }
      function formatNumber(value) { return Math.floor(value).toLocaleString("ko-KR"); }
      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }
      function skillArtStyle(id) {
        const positions = {
          prism: "0% 0%", lightning: "50% 0%", comet: "100% 0%",
          void: "0% 100%", drone: "50% 100%", bloom: "100% 100%",
          solar: "100% 0%", cryo: "0% 100%", mine: "100% 0%", echo: "50% 0%"
        };
        return `background-position:${positions[id] || "0% 0%"}`;
      }
      function utilityArtStyle(id) {
        const positions = {
          projectile: "0% 0%", attackSpeed: "50% 0%", moveSpeed: "100% 0%",
          collector: "0% 100%", critical: "50% 100%", aegis: "100% 100%",
          area: "0% 0%", luck: "50% 100%", regen: "100% 100%", phase: "100% 0%"
        };
        return `background-position:${positions[id] || "0% 0%"}`;
      }
      function cardHasArtwork(card) { return Boolean(skillDefs[card.id] || utilityDefs[card.id] || card.artId); }
      function cardArtClass(card) {
        if (skillDefs[card.id]) return "skill-art";
        if (utilityDefs[card.id] || card.artId) return "utility-art";
        return "";
      }
      function cardArtStyle(card) {
        if (skillDefs[card.id]) return `style="${skillArtStyle(card.id)}"`;
        if (utilityDefs[card.id] || card.artId) return `style="${utilityArtStyle(card.artId || card.id)}"`;
        return "";
      }
      function hexToRgba(hex, alpha) {
        const clean = hex.replace("#", "");
        const bigint = parseInt(clean, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return `rgba(${r},${g},${b},${alpha})`;
      }

      window.__skillOverdriveTest = {
        start: character => startGame(character || "nova"),
        state: () => game,
        quality: () => runtimeQuality,
        progression: (level, seconds = 0) => ({
          xpNeed: xpNeedForLevel(level),
          targetLevel: targetLevelAtTime(seconds),
          rate: progressionRate(level, seconds)
        }),
        durability: (level, seconds = 0) => enemyHpMultiplier(level, seconds),
        pressure: level => ({
          ...enemyPressureForLevel(level),
          effectiveTarget: effectiveEnemyTarget(level)
        }),
        catalog: () => ({
          attacks: Object.keys(skillDefs).length,
          utilities: Object.keys(utilityDefs).length,
          evolutions: Object.keys(evolutionDefs).length,
          transcendences: Object.keys(transcendDefs).length
        }),
        eligibleTranscendences: () => Object.entries(transcendDefs)
          .filter(([id, def]) => !game?.transcendences[id] && game && transcendRequirementMet(def))
          .map(([id]) => id),
        assetStats: () => Object.fromEntries(Object.entries(assets).map(([key, image]) => [
          key, { width: image.width, height: image.height, type: image.constructor.name }
        ])),
        setQuality: level => {
          options.quality = ["auto", "high", "balanced", "low"].includes(level) ? level : "auto";
          runtimeQuality = resolveQuality();
          enforceQualityCaps();
          return runtimeQuality;
        },
        grantXp: amount => { if (game) gainXp(amount); },
        setTime: seconds => { if (game) game.elapsed = seconds; },
        setHp: hp => { if (game) game.player.hp = hp; },
        spawnBoss: () => { if (game && !game.bossAlive) spawnBoss(); },
        spawnPickup: type => { if (game) spawnPickup(type === "heal" ? "heal" : "magnet", W / 2 + 34, H / 2); },
        spawnVariants: () => {
          if (!game) return [];
          Object.keys(proceduralEnemyDefs).forEach(type => spawnEnemy(false, type));
          return game.entities.enemies.filter(enemy => enemy.procedural).map(enemy => enemy.type);
        },
        stress: (count = 300) => {
          if (!game) return 0;
          for (let i = 0; i < count; i++) spawnEnemy(i % 7 === 0);
          return game.entities.enemies.length;
        },
        grantBuild: () => {
          if (!game) return;
          Object.keys(game.skills).forEach(id => game.skills[id] = 5);
          updateSkillRack();
        },
        grantUtilities: () => {
          if (!game) return;
          Object.keys(game.utilities).forEach(id => game.utilities[id] = 5);
          game.player.xpGain = Math.pow(1.15, 5);
          game.player.magnet = 125 + 28 * 5;
          updateSkillRack();
        },
        unlockTranscendence: id => {
          if (!game || !transcendDefs[id]) return false;
          game.transcendences[id] = true;
          updateSkillRack();
          return true;
        },
        finish: victory => { if (game) finishGame(Boolean(victory)); }
      };

      ui.best.textContent = formatNumber(Number(localStorage.getItem(SAVE_KEY) || 0));
    })();
  </script>
</body>
