      async function startGame(characterId = game?.character || "nova") {
        await loadAssets(characterId);
        audio.startMusic();
        runtimeQuality = resolveQuality();
        game = initialGame(characterId);
        for (let i = 0; i < 26; i++) spawnAmbientOrb();
        titleScreen.hidden = true;
        gameScreen.hidden = false;
        overlayRoot.innerHTML = "";
        ui.playerName.textContent = characterDefs[characterId].name;
        ui.best.textContent = formatNumber(Number(localStorage.getItem(SAVE_KEY) || 0));
        updateSkillRack();
        updateHud();
        addBurst(W / 2, H / 2, characterDefs[characterId].color, options.reducedFx ? 24 : 58, 260);
        showToast(`3-SKILL LOADOUT · ${characterDefs[characterId].starts.map(id => skillDefs[id].name).join(" + ")}`);
        audio.play("level");
        lastTime = performance.now();
        cancelAnimationFrame(frameHandle);
        frameHandle = requestAnimationFrame(loop);
      }

      function loop(now) {
        const dt = Math.min(.034, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        if (game && game.mode === "playing") {
          monitorPerformance(dt);
          const scale = game.slowTimer > 0 ? .24 : 1;
          game.slowTimer = Math.max(0, game.slowTimer - dt);
          update(dt * scale);
        }
        if (game) render();
        frameHandle = requestAnimationFrame(loop);
      }

      function update(dt) {
        game.elapsed += dt;
        game.progressionMultiplier = progressionRate(game.level, game.elapsed);
        game.noHitTime += dt;
        game.noHitMultiplier = 1 + Math.min(2, Math.floor(game.noHitTime / 20) * .25);
        game.player.hitCooldown = Math.max(0, game.player.hitCooldown - dt);
        game.player.magnetTimer = Math.max(0, game.player.magnetTimer - dt);
        game.cooldowns.regen -= dt;
        if (game.utilities.regen > 0 && game.cooldowns.regen <= 0) {
          game.player.hp = Math.min(game.player.maxHp, game.player.hp + game.utilities.regen * .8);
          game.cooldowns.regen = 1;
        }
        game.comboTimer -= dt;
        if (game.comboTimer <= 0 && game.combo > 1) game.combo = Math.max(1, game.combo - dt * 1.7);
        screenFlash = Math.max(0, screenFlash - dt * 2.5);
        shake = Math.max(0, shake - dt * 28);

        updatePlayer(dt);
        updateSpawning(dt);
        updateEnemies(dt);
        updateOrbs(dt);
        updatePickups(dt);
        updateSkills(dt);
        updateComets(dt);
        updateZones(dt);
        updateParticles(dt);
        updateEffects(dt);

        if (game.elapsed >= RUN_TIME) finishGame(true);
        updateHud();
      }

      function updatePlayer(dt) {
        let dx = 0;
        let dy = 0;
        if (keys.has("ArrowLeft") || keys.has("a")) dx -= 1;
        if (keys.has("ArrowRight") || keys.has("d")) dx += 1;
        if (keys.has("ArrowUp") || keys.has("w")) dy -= 1;
        if (keys.has("ArrowDown") || keys.has("s")) dy += 1;
        dx += touchMove.x;
        dy += touchMove.y;
        const length = Math.hypot(dx, dy) || 1;
        game.player.moving = Math.abs(dx) + Math.abs(dy) > 0;
        const targetMoveX = game.player.moving ? dx / length : 0;
        const targetMoveY = game.player.moving ? dy / length : 0;
        game.player.moveX += (targetMoveX - game.player.moveX) * Math.min(1, dt * 28);
        game.player.moveY += (targetMoveY - game.player.moveY) * Math.min(1, dt * 28);
        game.player.lean += (targetMoveX * .13 - game.player.lean) * Math.min(1, dt * 24);
        if (Math.abs(dx) + Math.abs(dy) > 0) {
          if (Math.abs(dx) > .08) game.player.facing = dx < 0 ? -1 : 1;
          const moveX = dx / length * game.player.speed * dt;
          const moveY = dy / length * game.player.speed * dt;
          game.camera.x += moveX;
          game.camera.y += moveY;
          scrollWorld(-moveX, -moveY);
          game.trailClock -= dt;
          if (game.trailClock <= 0) {
            game.trailClock = options.reducedFx ? .075 : .028;
            game.entities.particles.push({
              x: game.player.x - dx / length * 28 + (Math.random() - .5) * 20,
              y: game.player.y - dy / length * 28 + (Math.random() - .5) * 20,
              vx: -dx / length * (110 + Math.random() * 100),
              vy: -dy / length * (110 + Math.random() * 100),
              life: .24 + Math.random() * .2,
              maxLife: .44,
              size: 2 + Math.random() * 4,
              color: game.character === "bolt" ? "#ffd56a" : game.character === "eclipse" ? "#ff43cd" : "#4ef4ff"
            });
          }
        }
        game.player.x = W / 2;
        game.player.y = H / 2;
        const fieldSignal = Math.sin(game.camera.x / 430) + Math.cos(game.camera.y / 370) + Math.sin((game.camera.x + game.camera.y) / 620);
        const danger = fieldSignal > 1.12;
        if (danger !== game.dangerActive) {
          game.dangerActive = danger;
          if (danger) showToast("⚠ 위험 공명 구역 · 점수 x1.5");
        }
        game.dangerMultiplier = danger ? 1.5 : 1;
      }

      function scrollWorld(dx, dy) {
        const groups = [
          game.entities.enemies, game.entities.orbs, game.entities.pickups, game.entities.particles,
          game.entities.zones, game.entities.comets
        ];
        for (const group of groups) {
          for (const entity of group) {
            entity.x += dx;
            entity.y += dy;
            if (entity.ambient) {
              if (entity.x < -90) entity.x += W + 180;
              if (entity.x > W + 90) entity.x -= W + 180;
              if (entity.y < -90) entity.y += H + 180;
              if (entity.y > H + 90) entity.y -= H + 180;
            }
          }
        }
        for (const effect of game.entities.effects) {
          if (Number.isFinite(effect.x)) effect.x += dx;
          if (Number.isFinite(effect.y)) effect.y += dy;
          if (effect.points) {
            effect.points.forEach(point => {
              point.x += dx;
              point.y += dy;
            });
          }
        }
      }

      function updateSpawning(dt) {
        game.spawnClock -= dt;
        game.ambientOrbClock -= dt;
        game.pickupClock -= dt;
        if (game.elapsed > 50 && !assets.boss && !assetLoads.boss) loadAsset("boss");
        if (game.ambientOrbClock <= 0) {
          game.ambientOrbClock = Math.max(.85, 1.75 - game.elapsed / 420);
          const orbCap = runtimeQuality === "low" ? 58 : runtimeQuality === "balanced" ? 74 : 90;
          if (game.entities.orbs.length < orbCap) {
            spawnAmbientOrb();
            if (Math.random() < .24) spawnAmbientOrb();
          }
        }
        if (game.pickupClock <= 0) {
          game.pickupClock = 24 + Math.random() * 12;
          if (game.entities.pickups.length < 4) {
            const healChance = game.player.hp < game.player.maxHp * .6 ? .7 : .4;
            spawnPickup(Math.random() < healChance ? "heal" : "magnet");
          }
        }
        const pressure = enemyPressureForLevel(game.level);
        const target = effectiveEnemyTarget(game.level);
        if (game.spawnClock <= 0) {
          game.spawnClock = Math.max(.11, pressure.interval / (1 + game.elapsed / 600));
          const deficit = Math.max(0, target - game.entities.enemies.length);
          const count = Math.min(deficit, pressure.batch + Math.min(2, Math.floor(deficit / 18)));
          for (let i = 0; i < count; i++) {
            spawnEnemy(Math.random() < Math.min(.24, game.level / 260));
          }
        }
        if (game.elapsed >= game.nextBossAt && !game.bossAlive) {
          spawnBoss();
          game.nextBossAt += 90;
        }
      }

      function spawnAmbientOrb() {
        if (!game) return;
        const margin = 72;
        let x = margin + Math.random() * (W - margin * 2);
        let y = margin + Math.random() * (H - margin * 2);
        if (Math.hypot(x - game.player.x, y - game.player.y) < 135) {
          x = clamp(x + W * .32, margin, W - margin);
          y = clamp(y + H * .22, margin, H - margin);
        }
        game.entities.orbs.push({
          x, y,
          value: Math.random() < .16 ? 7 : 3,
          life: 35,
          phase: Math.random() * Math.PI * 2,
          ambient: true
        });
      }

      function spawnPickup(type, x, y) {
        if (!game || game.entities.pickups.length >= 8) return;
        const margin = 95;
        game.entities.pickups.push({
          type,
          x: Number.isFinite(x) ? x : margin + Math.random() * (W - margin * 2),
          y: Number.isFinite(y) ? y : margin + Math.random() * (H - margin * 2),
          life: 24,
          phase: Math.random() * Math.PI * 2
        });
      }

      function spawnPoint(padding = 70) {
        const side = Math.floor(Math.random() * 4);
        if (side === 0) return { x: -padding, y: Math.random() * H };
        if (side === 1) return { x: W + padding, y: Math.random() * H };
        if (side === 2) return { x: Math.random() * W, y: -padding };
        return { x: Math.random() * W, y: H + padding };
      }

      function spawnEnemy(charger = false, forcedType = null) {
        const enemyCap = enemyLimit();
        if (game.entities.enemies.length >= enemyCap) return;
        const point = spawnPoint();
        const durabilityScale = enemyHpMultiplier(game.level, game.elapsed);
        const speedScale = Math.min(1.75, 1 + game.elapsed / 260);
        const variantChance = game.elapsed < 20 ? .35 : Math.min(.76, .48 + game.level / 180);
        const variants = game.elapsed < 45 ? ["shard", "wisp", "sentinel"] : Object.keys(proceduralEnemyDefs);
        const proceduralType = forcedType || (!charger && Math.random() < variantChance
          ? variants[Math.floor(Math.random() * variants.length)]
          : null);
        const def = proceduralType ? proceduralEnemyDefs[proceduralType] : null;
        const type = charger ? "charger" : proceduralType || "hound";
        const hp = def?.hp ?? (charger ? 56 : 34);
        const speed = def?.speed ?? (charger ? 100 : 72);
        const eliteChance = game.level < 30 ? 0 : Math.min(.22, (game.level - 25) * .004);
        const elite = Math.random() < eliteChance;
        const toughness = .9 + Math.random() * .2;
        const finalHp = hp * durabilityScale * toughness * (elite ? 2.4 : 1);
        const baseDamage = def?.damage ?? (charger ? 18 : 11);
        game.entities.enemies.push({
          x: point.x,
          y: point.y,
          type,
          procedural: Boolean(def),
          color: def?.color,
          scoreValue: (def?.score ?? (charger ? 90 : 45)) * (elite ? 2 : 1),
          xpValue: (def?.xp ?? (charger ? 6 : 3)) * (elite ? 1.5 : 1),
          orbCount: (def?.orbs ?? (charger ? 4 : 1)) + (elite ? 2 : 0),
          hp: finalHp,
          maxHp: finalHp,
          durabilityScale,
          elite,
          entryProtected: true,
          spawnAge: 0,
          speed: speed * speedScale,
          damage: baseDamage * (1 + Math.min(.5, game.level * .006)) * (elite ? 1.2 : 1),
          r: (def?.r ?? (charger ? 25 : 20)) * (elite ? 1.12 : 1),
          size: (def?.size ?? (charger ? 78 : 58)) * (elite ? 1.16 : 1),
          phase: Math.random() * Math.PI * 2,
          turn: Math.random() < .5 ? -1 : 1,
          dashClock: charger ? 1.2 + Math.random() : proceduralType === "shard" ? .7 + Math.random() : 99,
          boss: false,
          hit: {}
        });
      }

      function spawnBoss() {
        if (!assets.boss && !assetLoads.boss) loadAsset("boss");
        const point = spawnPoint(150);
        const scale = (1 + game.bossIndex * .45)
          * Math.max(1, enemyHpMultiplier(game.level, game.elapsed) * .45);
        const bossHp = 2400 * scale;
        const boss = {
          x: point.x,
          y: point.y,
          type: "boss",
          hp: bossHp,
          maxHp: bossHp,
          durabilityScale: enemyHpMultiplier(game.level, game.elapsed),
          entryProtected: true,
          spawnAge: 0,
          speed: 32 + game.bossIndex * 4,
          damage: 28,
          r: 68,
          size: 190,
          phase: 0,
          dashClock: 4,
          boss: true,
          hit: {}
        };
        game.bossIndex += 1;
        game.bossAlive = boss;
        game.entities.enemies.push(boss);
        showToast("⚠ 아스트랄 디바우러 출현");
        audio.play("boss");
        addBurst(W / 2, H / 2, "#ff43cd", 60, 460);
        shake = options.screenShake ? 18 : 0;
      }

      function updateEnemies(dt) {
        const enemies = game.entities.enemies;
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          enemy.spawnAge = (enemy.spawnAge || 0) + dt;
          const dx = game.player.x - enemy.x;
          const dy = game.player.y - enemy.y;
          const dist = Math.hypot(dx, dy) || 1;
          let speed = enemy.speed;
          enemy.slowTimer = Math.max(0, (enemy.slowTimer || 0) - dt);
          if (enemy.slowTimer > 0) speed *= .55;
          if (enemy.type === "charger" || enemy.type === "shard") {
            enemy.dashClock -= dt;
            if (enemy.dashClock < (enemy.type === "shard" ? .2 : .38)) speed *= enemy.type === "shard" ? 2.1 : 3.5;
            if (enemy.dashClock <= 0) enemy.dashClock = enemy.type === "shard"
              ? 1.15 + Math.random() * .6
              : 1.9 + Math.random() * .8;
          }
          let moveX = dx / dist;
          let moveY = dy / dist;
          if (enemy.type === "sentinel") {
            const curve = Math.sin(enemy.phase * 1.7) * .72 * enemy.turn;
            moveX += -dy / dist * curve;
            moveY += dx / dist * curve;
          } else if (enemy.type === "wisp") {
            const flutter = Math.sin(enemy.phase * 3.4) * .92;
            moveX += -dy / dist * flutter;
            moveY += dx / dist * flutter;
          }
          const moveLength = Math.hypot(moveX, moveY) || 1;
          enemy.x += moveX / moveLength * speed * dt;
          enemy.y += moveY / moveLength * speed * dt;
          if (enemy.entryProtected) {
            const enteredArena = enemy.x >= -8 && enemy.x <= W + 8
              && enemy.y >= -8 && enemy.y <= H + 8;
            if (enteredArena || enemy.spawnAge >= 4) enemy.entryProtected = false;
          }
          enemy.phase += dt * (enemy.boss ? .6 : 3.5);
          Object.keys(enemy.hit).forEach(key => enemy.hit[key] = Math.max(0, enemy.hit[key] - dt));

          if (dist < enemy.r + 19 && game.player.hitCooldown <= 0) {
            damagePlayer(enemy.damage);
            const push = 25;
            enemy.x -= dx / dist * push;
            enemy.y -= dy / dist * push;
          }
        }
      }

      function damagePlayer(amount) {
        const phaseChance = Math.min(.65, game.utilities.phase * .05
          + (game.transcendences.chronoPhantom ? .2 : 0));
        if (phaseChance > 0 && Math.random() < phaseChance) {
          game.player.hitCooldown = .38;
          addBurst(game.player.x, game.player.y, "#9c7bff", 14, 150);
          audio.play("void");
          return;
        }
        amount *= Math.max(.7, 1 - game.utilities.aegis * .06);
        game.player.hp = Math.max(0, game.player.hp - amount);
        game.noHitTime = 0;
        game.noHitMultiplier = 1;
        game.player.hitCooldown = 1.25;
        for (const enemy of game.entities.enemies) {
          const dx = enemy.x - game.player.x;
          const dy = enemy.y - game.player.y;
          const dist = Math.hypot(dx, dy) || 1;
          if (dist < 150 + enemy.r) {
            const force = enemy.boss ? 34 : 92;
            enemy.x += dx / dist * force;
            enemy.y += dy / dist * force;
          }
        }
        shake = options.screenShake ? Math.max(shake, 11) : 0;
        screenFlash = options.reducedFx ? .12 : .32;
        addBurst(game.player.x, game.player.y, "#ff557f", 18, 170);
        audio.play("playerHit");
        if (game.player.hp <= 0) finishGame(false);
      }

      function updateOrbs(dt) {
        const orbs = game.entities.orbs;
        const vacuum = game.player.magnetTimer > 0;
        for (let i = orbs.length - 1; i >= 0; i--) {
          const orb = orbs[i];
          orb.life -= dt;
          const dx = game.player.x - orb.x;
          const dy = game.player.y - orb.y;
          const dist = Math.hypot(dx, dy) || 1;
          if (vacuum || dist < game.player.magnet) {
            const speed = vacuum ? 760 + dist * 1.35 : 230 + (game.player.magnet - dist) * 5;
            orb.x += dx / dist * speed * dt;
            orb.y += dy / dist * speed * dt;
          }
          if (dist < 23) {
            gainXp(orb.value);
            orbs.splice(i, 1);
          } else if (orb.life <= 0) {
            if (orb.ambient) {
              orb.life = 22;
              orb.x = 72 + Math.random() * (W - 144);
              orb.y = 72 + Math.random() * (H - 144);
            } else {
              orbs.splice(i, 1);
            }
          }
        }
      }

      function updatePickups(dt) {
        const pickups = game.entities.pickups;
        for (let i = pickups.length - 1; i >= 0; i--) {
          const pickup = pickups[i];
          pickup.life -= dt;
          pickup.phase += dt * 2.4;
          const dx = game.player.x - pickup.x;
          const dy = game.player.y - pickup.y;
          const dist = Math.hypot(dx, dy) || 1;
          if (dist < 92) {
            const speed = 170 + (92 - dist) * 4;
            pickup.x += dx / dist * speed * dt;
            pickup.y += dy / dist * speed * dt;
          }
          if (dist < 28) {
            if (pickup.type === "heal") {
              const amount = Math.max(30, Math.round(game.player.maxHp * .32));
              const before = game.player.hp;
              game.player.hp = Math.min(game.player.maxHp, game.player.hp + amount);
              if (game.player.hp === before) game.score += 600;
              showToast(game.player.hp === before ? "리페어 코어 · 최대 체력, 점수 +600" : `리페어 코어 · 체력 +${Math.ceil(game.player.hp - before)}`);
              addBurst(game.player.x, game.player.y, "#6affc1", 28, 220);
            } else {
              game.player.magnetTimer = Math.max(game.player.magnetTimer, 6);
              showToast("그래비티 자석 · 모든 경험치 6초간 흡수");
              addBurst(game.player.x, game.player.y, "#4ef4ff", 36, 280);
            }
            audio.play("level");
            pickups.splice(i, 1);
          } else if (pickup.life <= 0) {
            pickups.splice(i, 1);
          }
        }
      }

      function gainXp(value) {
        game.xp += value * game.player.xpGain * game.progressionMultiplier;
        while (game.xp >= game.xpNeed) {
          game.xp -= game.xpNeed;
          game.level += 1;
          game.xpNeed = xpNeedForLevel(game.level);
          game.pendingLevels += 1;
          rebalanceExistingEnemies(game.level);
          spawnLevelReinforcements(game.level);
          audio.play("level");
        }
        if (game.pendingLevels > 0 && game.mode === "playing") showLevelUp();
      }

      function updateSkills(dt) {
        updatePrism(dt);
        updateLightning(dt);
        updateVoid(dt);
        updateDrones(dt);
        updateBloom(dt);
        updateSolar(dt);
        updateCryo(dt);
        updateMines(dt);
        updateEcho(dt);
        game.cooldowns.comet -= dt;
        if (game.skills.comet > 0 && game.cooldowns.comet <= 0) {
          castComet();
          game.cooldowns.comet = Math.max(.45, 2.35 - game.skills.comet * .25)
            * (game.evolutions.supernova ? .7 : 1)
            * (game.transcendences.starfallEngine ? .65 : 1) * attackSpeedScale();
        }
      }

      function updateDrones(dt) {
        const level = game.skills.drone;
        if (!level) return;
        game.cooldowns.drone -= dt;
        if (game.cooldowns.drone > 0) return;
        const count = Math.min(12, (level >= 4 ? 3 : level >= 2 ? 2 : 1)
          + Math.ceil(projectileBonus() / 2)
          + (game.transcendences.seraphSquadron ? 4 : 0)
          + (game.transcendences.omegaArray ? 2 : 0));
        const targets = [...game.entities.enemies]
          .sort((a, b) => distance(a, game.player) - distance(b, game.player))
          .slice(0, count);
        const points = [];
        targets.forEach((enemy, index) => {
          const angle = game.elapsed * 2.2 + index / count * Math.PI * 2;
          const origin = { x: game.player.x + Math.cos(angle) * 82, y: game.player.y + Math.sin(angle) * 56 };
          damageEnemy(enemy, (15 + level * 8) * game.player.power
            * (game.transcendences.seraphSquadron ? 1.5 : 1), "drone");
          points.push(origin, { x: enemy.x, y: enemy.y });
          if (level >= 3) {
            const bounce = game.entities.enemies.find(target => target !== enemy && distance(target, enemy) < 135);
            if (bounce) {
              damageEnemy(bounce, (10 + level * 5) * game.player.power, "droneBounce");
              points.push({ x: enemy.x, y: enemy.y }, { x: bounce.x, y: bounce.y });
            }
          }
        });
        if (points.length) game.entities.effects.push({
          type: "droneLaser", points, life: .16, maxLife: .16, color: "#6affc1", width: level >= 4 ? 5 : 3
        });
        game.cooldowns.drone = Math.max(.28, 1.18 - level * .13)
          * (game.transcendences.seraphSquadron ? .68 : 1) * attackSpeedScale();
      }

      function updateBloom(dt) {
        const level = game.skills.bloom;
        if (!level) return;
        game.cooldowns.bloom -= dt;
        if (game.cooldowns.bloom > 0) return;
        const targets = [...game.entities.enemies]
          .sort((a, b) => distance(a, game.player) - distance(b, game.player))
          .slice(0, (level >= 2 ? 2 : 1) + projectileBonus()
            + (game.transcendences.eternalGarden ? 4 : 0));
        for (const target of targets) {
          const radius = (42 + level * 9 + (game.transcendences.eternalGarden ? 28 : 0)) * areaScale();
          game.entities.effects.push({
            type: "bloom", x: target.x, y: target.y, r: radius,
            life: .52, maxLife: .52, color: "#ff8bd8", level
          });
          damageEnemy(target, (24 + level * 12) * game.player.power, "bloom");
          if (level >= 3) {
            const chains = [...game.entities.enemies]
              .filter(enemy => enemy !== target && distance(enemy, target) < radius * 2.4)
              .slice(0, level >= 5 ? 5 : 2);
            chains.forEach(enemy => damageEnemy(enemy, (12 + level * 6) * game.player.power, "bloomChain"));
          }
          addBurst(target.x, target.y, "#ff8bd8", options.reducedFx ? 7 : 18, 145);
        }
        if (game.transcendences.eternalGarden) {
          game.player.hp = Math.min(game.player.maxHp, game.player.hp + .8);
        }
        game.cooldowns.bloom = Math.max(.65, 2.25 - level * .23)
          * (game.transcendences.eternalGarden ? .62 : 1) * attackSpeedScale();
      }

      function updateSolar(dt) {
        const level = game.skills.solar;
        if (!level) return;
        game.cooldowns.solar -= dt;
        if (game.cooldowns.solar > 0) return;
        const transcended = game.transcendences.heliosDominion;
        const omega = game.transcendences.omegaArray;
        const count = 1 + Math.floor(level / 2) + projectileBonus()
          + (transcended ? 6 : 0) + (omega ? 3 : 0);
        const targets = nearestEnemies(count);
        const points = [];
        const damage = (24 + level * 13) * game.player.power * (transcended ? 1.45 : 1);
        for (const target of targets) {
          damageEnemy(target, damage, "solar");
          points.push({ x: game.player.x, y: game.player.y }, { x: target.x, y: target.y });
          if (level >= 3 || transcended) {
            const radius = (24 + level * 4 + (transcended ? 26 : 0)) * areaScale();
            for (const enemy of [...game.entities.enemies]) {
              if (enemy !== target && distance(enemy, target) < radius) {
                damageEnemy(enemy, damage * .36, "solarBurst");
              }
            }
            game.entities.effects.push({
              type: "explosion", x: target.x, y: target.y, r: radius,
              life: .28, maxLife: .28, color: "#ffd56a"
            });
          }
        }
        if (points.length) game.entities.effects.push({
          type: "droneLaser", points, life: .2, maxLife: .2,
          color: transcended ? "#ffffff" : "#ffd56a", width: transcended ? 8 : 5
        });
        game.cooldowns.solar = Math.max(.32, 1.75 - level * .17)
          * (transcended ? .62 : 1) * attackSpeedScale();
      }

      function updateCryo(dt) {
        const level = game.skills.cryo;
        if (!level) return;
        game.cooldowns.cryo -= dt;
        if (game.cooldowns.cryo > 0) return;
        const transcended = game.transcendences.absoluteZero;
        const radius = (105 + level * 22 + (transcended ? 170 : 0)) * areaScale();
        const damage = (18 + level * 10) * game.player.power * (transcended ? 1.65 : 1);
        for (const enemy of [...game.entities.enemies]) {
          if (distance(enemy, game.player) <= radius + enemy.r) {
            damageEnemy(enemy, damage, "cryo");
            enemy.slowTimer = Math.max(enemy.slowTimer || 0, transcended ? 4 : 1.1 + level * .28);
          }
        }
        game.entities.effects.push({
          type: "pulse", x: game.player.x, y: game.player.y, r: radius,
          life: .58, maxLife: .58, color: transcended ? "#ffffff" : "#7fe8ff"
        });
        if (level >= 3) {
          game.entities.effects.push({
            type: "delayedPulse", x: game.player.x, y: game.player.y,
            r: radius * .72, damage: damage * .55, color: "#7fe8ff",
            delay: .22, life: .75, maxLife: .75
          });
        }
        game.cooldowns.cryo = Math.max(.9, 3.25 - level * .3)
          * (transcended ? .7 : 1) * attackSpeedScale();
      }

      function updateMines(dt) {
        const level = game.skills.mine;
        if (!level) return;
        game.cooldowns.mine -= dt;
        if (game.cooldowns.mine > 0) return;
        const transcended = game.transcendences.singularityMinefield;
        const count = 1 + Math.floor(level / 2) + projectileBonus() + (transcended ? 6 : 0);
        const targets = nearestEnemies(count);
        const radius = (38 + level * 8 + (transcended ? 34 : 0)) * areaScale();
        const damage = (32 + level * 15) * game.player.power * (transcended ? 1.45 : 1);
        for (const target of targets) {
          for (const enemy of [...game.entities.enemies]) {
            if (distance(enemy, target) <= radius + enemy.r) damageEnemy(enemy, damage, "mine");
          }
          game.entities.effects.push({
            type: "explosion", x: target.x, y: target.y, r: radius,
            life: .5, maxLife: .5, color: transcended ? "#ff43cd" : "#ffb45c"
          });
        }
        game.cooldowns.mine = Math.max(.55, 2.35 - level * .2)
          * (transcended ? .62 : 1) * attackSpeedScale();
      }

      function updateEcho(dt) {
        const level = game.skills.echo;
        if (!level) return;
        game.cooldowns.echo -= dt;
        if (game.cooldowns.echo > 0) return;
        const transcended = game.transcendences.infiniteEcho;
        const count = 2 + level * 2 + projectileBonus() + (transcended ? 10 : 0);
        const targets = nearestEnemies(count);
        const points = [{ x: game.player.x, y: game.player.y }];
        const damage = (16 + level * 8) * game.player.power * (transcended ? 1.38 : 1);
        targets.forEach((enemy, index) => {
          damageEnemy(enemy, damage * Math.max(.55, 1 - index * .018), "echo");
          points.push({ x: enemy.x, y: enemy.y });
          if (level >= 3 && index % 3 === 0) damageEnemy(enemy, damage * .45, "echoReturn");
        });
        if (points.length > 1) game.entities.effects.push({
          type: "lightning", points, life: .2, maxLife: .2,
          color: transcended ? "#ffffff" : "#ff70e7", width: transcended ? 6 : 3
        });
        game.cooldowns.echo = Math.max(.24, 1.45 - level * .13)
          * (transcended ? .58 : 1) * attackSpeedScale();
      }

      function updatePrism(dt) {
        const level = game.skills.prism;
        if (!level) return;
        const count = (level >= 2 ? 2 : 1) + (level >= 4 ? 2 : 0)
          + (game.evolutions.aurora ? 4 : 0) + projectileBonus()
          + (game.transcendences.infiniteEdge ? 6 : 0)
          + (game.transcendences.chronoPhantom ? 2 : 0);
        const radius = (62 + level * 10 + (game.evolutions.aurora ? 32 : 0)
          + (game.transcendences.infiniteEdge ? 35 : 0)) * areaScale();
        const time = game.elapsed * (1.7 + level * .12) * (1 + game.utilities.attackSpeed * .12);
        for (let blade = 0; blade < count; blade++) {
          const angle = time + blade / count * Math.PI * 2;
          const bx = game.player.x + Math.cos(angle) * radius;
          const by = game.player.y + Math.sin(angle) * radius * .72;
          for (const enemy of game.entities.enemies) {
            if (enemy.hit.prism > 0) continue;
            if (Math.hypot(enemy.x - bx, enemy.y - by) < enemy.r + 18) {
              damageEnemy(enemy, (18 + level * 8) * game.player.power
                * (game.evolutions.aurora ? 1.55 : 1)
                * (game.transcendences.infiniteEdge ? 1.35 : 1), "prism");
              enemy.hit.prism = .28;
              addBurst(bx, by, level >= 5 ? "#ff43cd" : "#4ef4ff", level >= 3 ? 7 : 3, 85);
            }
          }
        }
      }

      function updateLightning(dt) {
        if (!game.skills.lightning) return;
        game.cooldowns.lightning -= dt;
        if (game.cooldowns.lightning > 0) return;
        const level = game.skills.lightning;
        const maxTargets = 1 + level + (level >= 4 ? 2 : 0)
          + (game.evolutions.aurora ? 5 : 0) + projectileBonus()
          + (game.transcendences.stormCrown ? 8 : 0);
        const sorted = [...game.entities.enemies]
          .sort((a, b) => distance(a, game.player) - distance(b, game.player))
          .slice(0, maxTargets);
        const points = [{ x: game.player.x, y: game.player.y }];
        let damage = (22 + level * 11) * game.player.power;
        sorted.forEach((enemy, index) => {
          damageEnemy(enemy, damage * (1 - index * .045), "lightning");
          points.push({ x: enemy.x, y: enemy.y });
        });
        if (points.length > 1) {
          game.entities.effects.push({
            type: "lightning",
            points,
            life: options.reducedFx ? .1 : .18,
            maxLife: options.reducedFx ? .1 : .18,
            color: game.evolutions.aurora ? "#ffd56a" : "#8f7bff",
            width: game.evolutions.aurora ? 7 : 4
          });
        }
        if (level >= 3 && sorted.length) {
          const last = sorted[sorted.length - 1];
          game.entities.zones.push({
            type: "electric",
            x: last.x, y: last.y, r: 42 + level * 5, life: 1.3, maxLife: 1.3,
            tick: 0, damage: 9 + level * 3
          });
        }
        game.cooldowns.lightning = Math.max(.26, 1.5 - level * .16)
          * (game.evolutions.aurora ? .52 : 1)
          * (game.transcendences.stormCrown ? .62 : 1)
          * (game.character === "bolt" ? .88 : 1)
          * attackSpeedScale();
      }

      function updateVoid(dt) {
        if (!game.skills.void) return;
        game.cooldowns.void -= dt;
        if (game.cooldowns.void > 0) return;
        const level = game.skills.void;
        const radius = (105 + level * 24 + (game.evolutions.supernova ? 80 : 0)
          + (game.transcendences.eventHorizon ? 110 : 0)) * areaScale();
        castPulse(radius, (28 + level * 13) * game.player.power, level >= 3);
        const utilityPulses = Math.min(4, Math.floor((projectileBonus() + 1) / 2));
        for (let pulse = 0; pulse < utilityPulses; pulse++) {
          game.entities.effects.push({
            type: "delayedPulse", x: game.player.x, y: game.player.y,
            r: radius * (.78 + pulse * .08), damage: (16 + level * 7) * game.player.power,
            delay: .2 + pulse * .18, life: .72 + pulse * .18, maxLife: .72 + pulse * .18
          });
        }
        if (level >= 4) {
          game.entities.effects.push({
            type: "delayedPulse", x: game.player.x, y: game.player.y,
            r: radius * .88, damage: (22 + level * 8) * game.player.power,
            delay: .32, life: .7, maxLife: .7
          });
        }
        game.cooldowns.void = Math.max(1.15, 3.7 - level * .4)
          * (game.evolutions.supernova ? .72 : 1)
          * (game.transcendences.eventHorizon ? .6 : 1) * attackSpeedScale();
      }

      function castPulse(radius, damage, pull) {
        game.entities.effects.push({
          type: "pulse", x: game.player.x, y: game.player.y, r: radius,
          life: .55, maxLife: .55, color: game.evolutions.supernova ? "#ff43cd" : "#b04fff"
        });
        for (const enemy of game.entities.enemies) {
          const dx = enemy.x - game.player.x;
          const dy = enemy.y - game.player.y;
          const dist = Math.hypot(dx, dy) || 1;
          if (dist <= radius + enemy.r) {
            damageEnemy(enemy, damage, "void");
            const force = pull ? -28 : 38;
            enemy.x += dx / dist * force;
            enemy.y += dy / dist * force;
          }
        }
        shake = options.screenShake ? Math.max(shake, 5) : 0;
      }

      function castComet() {
        const level = game.skills.comet;
        const targets = [...game.entities.enemies]
          .sort((a, b) => distance(a, game.player) - distance(b, game.player))
          .slice(0, (level >= 2 ? 2 : 1) + projectileBonus()
            + (game.transcendences.starfallEngine ? 4 : 0));
        if (!targets.length) return;
        targets.forEach((target, index) => {
          game.entities.comets.push({
            x: target.x, y: target.y, target,
            progress: -index * .14, size: level >= 4 ? 24 : 17,
            level, trail: []
          });
        });
      }

      function updateComets(dt) {
        const comets = game.entities.comets;
        for (let i = comets.length - 1; i >= 0; i--) {
          const comet = comets[i];
          comet.progress += dt * (game.skills.comet >= 5 ? 1.7 : 1.3);
          if (game.skills.comet >= 5 && comet.target && comet.target.hp > 0) {
            comet.x += (comet.target.x - comet.x) * dt * 3;
            comet.y += (comet.target.y - comet.y) * dt * 3;
          }
          if (comet.progress >= 1) {
            explodeComet(comet.x, comet.y, comet.level);
            comets.splice(i, 1);
          }
        }
      }

      function explodeComet(x, y, level) {
        const radius = (58 + level * 12 + (game.evolutions.supernova ? 75 : 0)
          + (game.transcendences.starfallEngine ? 55 : 0)) * areaScale();
        const damage = (46 + level * 22) * game.player.power
          * (game.evolutions.supernova ? 1.5 : 1)
          * (game.transcendences.starfallEngine ? 1.35 : 1);
        for (const enemy of game.entities.enemies) {
          if (Math.hypot(enemy.x - x, enemy.y - y) < radius + enemy.r) damageEnemy(enemy, damage, "comet");
        }
        game.entities.effects.push({
          type: "explosion", x, y, r: radius, life: .58, maxLife: .58,
          color: game.evolutions.supernova ? "#ff43cd" : "#ff765c"
        });
        if (level >= 3) {
          game.entities.zones.push({
            type: "fire", x, y, r: radius * .58, life: 3.2, maxLife: 3.2,
            tick: 0, damage: 9 + level * 4
          });
        }
        if (game.evolutions.supernova) {
          for (const enemy of game.entities.enemies) {
            const dx = x - enemy.x;
            const dy = y - enemy.y;
            const dist = Math.hypot(dx, dy) || 1;
            if (dist < radius * 2.4) {
              enemy.x += dx / dist * 44;
              enemy.y += dy / dist * 44;
            }
          }
        }
        addBurst(x, y, game.evolutions.supernova ? "#ff43cd" : "#ff9a56", options.reducedFx ? 16 : 42, 320);
        shake = options.screenShake ? Math.max(shake, game.evolutions.supernova ? 16 : 9) : 0;
        screenFlash = options.reducedFx ? .08 : .2;
      }

      function updateZones(dt) {
        const zones = game.entities.zones;
        for (let i = zones.length - 1; i >= 0; i--) {
          const zone = zones[i];
          zone.life -= dt;
          zone.tick -= dt;
          if (zone.tick <= 0) {
            zone.tick = .28;
            for (const enemy of game.entities.enemies) {
              if (Math.hypot(enemy.x - zone.x, enemy.y - zone.y) < zone.r + enemy.r) {
                damageEnemy(enemy, zone.damage * game.player.power, zone.type);
              }
            }
          }
          if (zone.life <= 0) zones.splice(i, 1);
        }
      }

      function updateParticles(dt) {
        const particles = game.entities.particles;
        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= .96;
          particle.vy *= .96;
          particle.size *= .985;
          if (particle.life <= 0) particles.splice(i, 1);
        }
        const qualityCap = runtimeQuality === "low" ? 120 : runtimeQuality === "balanced" ? 230 : 380;
        const cap = options.reducedFx ? Math.min(110, qualityCap) : qualityCap;
        if (particles.length > cap) particles.splice(0, particles.length - cap);
      }

      function updateEffects(dt) {
        const effects = game.entities.effects;
        for (let i = effects.length - 1; i >= 0; i--) {
          const effect = effects[i];
          effect.life -= dt;
          if (effect.type === "delayedPulse") {
            effect.delay -= dt;
            if (effect.delay <= 0 && !effect.fired) {
              effect.fired = true;
              const px = effect.x;
              const py = effect.y;
              game.entities.effects.push({
                type: "pulse", x: px, y: py, r: effect.r,
                life: .52, maxLife: .52, color: effect.color || "#ff43cd"
              });
              for (const enemy of game.entities.enemies) {
                if (Math.hypot(enemy.x - px, enemy.y - py) < effect.r + enemy.r) {
                  damageEnemy(enemy, effect.damage, "void");
                }
              }
            }
          }
          if (effect.life <= 0) effects.splice(i, 1);
        }
        const effectCap = runtimeQuality === "low" ? 110 : runtimeQuality === "balanced" ? 190 : 300;
        if (effects.length > effectCap) effects.splice(0, effects.length - effectCap);
      }

      function damageEnemy(enemy, amount, source) {
        if (!enemy || enemy.hp <= 0) return;
        if (enemy.entryProtected) return;
        const criticalChance = game.utilities.critical * .06 + game.utilities.luck * .02;
        const critical = criticalChance > 0 && Math.random() < criticalChance;
        if (critical) {
          amount *= 1.75;
          addBurst(enemy.x, enemy.y, "#ffd56a", options.reducedFx ? 4 : 10, 125);
        }
        enemy.hp -= amount;
        const sound = source.startsWith("void") ? "void"
          : source.startsWith("drone") ? "drone"
          : source.startsWith("bloom") ? "bloom"
          : ["prism", "lightning", "comet"].includes(source) ? source : "hit";
        audio.play(sound);
        enemy.hit[source] = Math.max(enemy.hit[source] || 0, .04);
        if (enemy.hp <= 0) killEnemy(enemy, source);
      }

      function killEnemy(enemy, source) {
        const index = game.entities.enemies.indexOf(enemy);
        if (index < 0) return;
        game.entities.enemies.splice(index, 1);
        if (enemy === game.bossAlive) game.bossAlive = null;

        const base = enemy.boss ? 1800 : enemy.scoreValue ?? (enemy.type === "charger" ? 90 : 45);
        game.combo = Math.min(9.9, game.combo + (enemy.boss ? 1.4 : .08));
        game.comboTimer = 2.2;
        game.bestCombo = Math.max(game.bestCombo, game.combo);
        game.score += Math.floor(base * game.combo * game.noHitMultiplier * game.dangerMultiplier);
        game.kills += 1;
        audio.play(enemy.boss ? "evolution" : "kill");

        const orbCount = enemy.boss ? 30 : enemy.orbCount ?? (enemy.type === "charger" ? 4 : 1);
        for (let i = 0; i < orbCount; i++) {
          game.entities.orbs.push({
            x: enemy.x + (Math.random() - .5) * 28,
            y: enemy.y + (Math.random() - .5) * 28,
            value: enemy.boss ? 12 : enemy.xpValue ?? (enemy.type === "charger" ? 6 : 3),
            life: 18,
            phase: Math.random() * 6.28
          });
        }
        addBurst(enemy.x, enemy.y, enemy.boss ? "#ffd56a" : "#ff43cd", enemy.boss ? 80 : 14, enemy.boss ? 450 : 180);
        if (enemy.boss) {
          spawnPickup("heal", enemy.x - 42, enemy.y);
          spawnPickup("magnet", enemy.x + 42, enemy.y);
        } else {
          const pickupRoll = Math.random();
          const luckBonus = game.utilities.luck * .003;
          if (pickupRoll < .018 + luckBonus) spawnPickup("heal", enemy.x, enemy.y);
          else if (pickupRoll < .028 + luckBonus * 1.7) spawnPickup("magnet", enemy.x, enemy.y);
        }

        if (game.skills.void >= 5 && source !== "voidChain") {
          for (const target of [...game.entities.enemies]) {
            if (Math.hypot(target.x - enemy.x, target.y - enemy.y) < 74) {
              damageEnemy(target, 20 * game.player.power, "voidChain");
            }
          }
          game.entities.effects.push({
            type: "explosion", x: enemy.x, y: enemy.y, r: 72,
            life: .35, maxLife: .35, color: "#b04fff"
          });
        }

        if (enemy.boss) {
          game.score += 5000;
          game.player.hp = Math.min(game.player.maxHp, game.player.hp + 35);
          game.slowTimer = .8;
          showToast("보스 격파! 대량의 에너지가 방출됩니다.");
          shake = options.screenShake ? 20 : 0;
        }
      }

      function addBurst(x, y, color, count, speed) {
        const particles = game.entities.particles;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const velocity = speed * (.22 + Math.random() * .78);
          particles.push({
            x, y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            life: .25 + Math.random() * .65,
            maxLife: .9,
            size: 1.5 + Math.random() * 5,
            color
          });
        }
      }

      function showLevelUp() {
        if (!game || game.mode !== "playing" || game.pendingLevels <= 0) return;
        game.mode = "levelup";
        game.pendingLevels -= 1;
        game.cards = buildCards();
        overlayRoot.innerHTML = levelUpMarkup(game.cards);
      }

      function buildCards() {
        const cards = [];
        for (const [id, evolution] of Object.entries(evolutionDefs)) {
          if (game.evolutions[id]) continue;
          if (evolution.requires.every(skill => game.skills[skill] >= 5)) {
            cards.push({ kind: "evolution", id, ...evolution });
          }
        }
        for (const [id, transcend] of Object.entries(transcendDefs)) {
          if (game.transcendences[id]) continue;
          if (transcendRequirementMet(transcend)) {
            cards.push({ kind: "transcend", id, ...transcend });
          }
        }

        const pool = [];
        for (const [id, def] of Object.entries(skillDefs)) {
          const level = game.skills[id];
          if (level < 5) {
            const card = {
              kind: level === 0 ? "new" : "upgrade",
              id,
              name: def.name,
              icon: def.icon,
              color: def.color,
              level,
              description: def.descriptions[level],
              change: level === 0 ? "신규 스킬 획득" : `LV.${level} → LV.${level + 1}`
            };
            pool.push({ ...card, weight: level > 0 ? 1.6 : 1 });
          }
        }
        for (const [id, def] of Object.entries(utilityDefs)) {
          const level = game.utilities[id];
          if (level >= 5) continue;
          pool.push({
            kind: "utility", id, name: def.name, icon: def.icon, color: def.color,
            level, description: def.descriptions[level],
            change: level === 0 ? "신규 유틸리티 획득" : `LV.${level} → LV.${level + 1}`,
            weight: level > 0 ? 1.3 : .9
          });
        }
        pool.push(
          {
            kind: "repeatable", id: "overcharge", artId: "critical",
            name: "무한 공명 증폭", icon: "⬆", color: "#ffd56a",
            description: "모든 스킬 피해량이 영구적으로 14% 증가합니다.",
            change: "피해량 +14%", weight: .55
          },
          {
            kind: "repeatable", id: "repair", artId: "aegis",
            name: "응급 코어 복원", icon: "♥", color: "#6affc1",
            description: "체력을 38 회복합니다.",
            change: "체력 +38", weight: .5
          },
          {
            kind: "repeatable", id: "flux", artId: "moveSpeed",
            name: "잔류 플럭스", icon: "➤", color: "#4ef4ff",
            description: "이동 속도가 3%, 경험치 흡수 범위가 10 증가합니다.",
            change: "이동 +3% · 흡수 +10", weight: .45
          }
        );

        while (cards.length < 3 && pool.length) {
          const totalWeight = pool.reduce((sum, card) => sum + (card.weight || 1), 0);
          let roll = Math.random() * totalWeight;
          let chosenIndex = 0;
          for (let i = 0; i < pool.length; i++) {
            roll -= pool[i].weight || 1;
            if (roll <= 0) { chosenIndex = i; break; }
          }
          const [card] = pool.splice(chosenIndex, 1);
          if (!cards.some(existing => existing.kind === card.kind && existing.id === card.id)) cards.push(card);
        }
        while (cards.length < 3) cards.push(pool[cards.length % pool.length]);
        return shuffle(cards).slice(0, 3);
      }

      function levelUpMarkup(cards) {
        return `
          <div class="overlay">
            <section class="modal">
              <p class="eyebrow">LEVEL ${game.level} · SKILL OVERDRIVE</p>
              <h2>에너지가 공명합니다.</h2>
              <p>카드 3장 중 하나를 선택하세요. 숫자키 <b>1~3</b>으로 즉시 선택할 수 있습니다.</p>
              <div class="cards">
                ${cards.map((card, index) => `
                  <button class="card ${card.kind === "evolution" ? "evolution" : card.kind === "transcend" ? "transcend" : ""}" type="button"
                    data-card="${index}" style="--card-glow:${hexToRgba(card.color, .28)}">
                    <span class="key">${index + 1}</span>
                    <span class="card-icon ${cardArtClass(card)}" ${cardArtStyle(card)}>${cardHasArtwork(card) ? "" : card.icon}</span>
                    <div class="card-type">${card.kind === "evolution" ? "ULTIMATE EVOLUTION" : card.kind === "transcend" ? "TRANSCENDENCE" : card.kind === "new" ? "NEW SKILL" : card.kind === "utility" ? "UTILITY MODULE" : "SKILL STACK"}</div>
                    <h3>${card.name}</h3>
                    <p>${card.description}</p>
                    <div class="change">${card.kind === "evolution" ? "궁극 진화 완성" : card.kind === "transcend" ? "초월 스킬 해방" : card.change}</div>
                  </button>
                `).join("")}
              </div>
            </section>
          </div>
        `;
      }

      function selectCard(index) {
        if (!game || game.mode !== "levelup") return;
        const card = game.cards[index];
        if (!card) return;
        audio.play("card");

        if (card.kind === "evolution") {
          game.evolutions[card.id] = true;
          game.score += 3000;
          screenFlash = options.reducedFx ? .16 : .65;
          shake = options.screenShake ? 18 : 0;
          audio.play("evolution");
          audio.setIntensity(Object.values(game.evolutions).filter(Boolean).length);
          showEvolution(card);
          return;
        }
        if (card.kind === "transcend") {
          game.transcendences[card.id] = true;
          if (card.powerMultiplier) game.player.power *= card.powerMultiplier;
          if (card.speedMultiplier) game.player.speed *= card.speedMultiplier;
          game.score += 5000;
          screenFlash = options.reducedFx ? .2 : .82;
          shake = options.screenShake ? 24 : 0;
          audio.play("evolution");
          audio.setIntensity(
            Object.values(game.evolutions).filter(Boolean).length
            + Object.values(game.transcendences).filter(Boolean).length * .35
          );
          showEvolution(card);
          return;
        }
        if (card.kind === "new" || card.kind === "upgrade") {
          game.skills[card.id] += 1;
          showToast(`${card.name} LV.${game.skills[card.id]}`);
        } else if (card.kind === "utility") {
          game.utilities[card.id] += 1;
          if (card.id === "moveSpeed") game.player.speed *= 1.08;
          if (card.id === "collector") {
            game.player.magnet += 28;
            game.player.xpGain *= 1.15;
          }
          if (card.id === "aegis") {
            game.player.maxHp += 10;
            game.player.hp = Math.min(game.player.maxHp, game.player.hp + 18);
          }
          showToast(`${card.name} LV.${game.utilities[card.id]}`);
        } else if (card.id === "overcharge") {
          game.player.power *= 1.14;
          showToast("모든 스킬 피해량 +14%");
        } else if (card.id === "repair") {
          game.player.hp = Math.min(game.player.maxHp, game.player.hp + 38);
          showToast("코어 복원 +38");
        } else if (card.id === "flux") {
          game.player.speed *= 1.03;
          game.player.magnet += 10;
          showToast("이동 속도와 흡수 범위 증가");
        }
        overlayRoot.innerHTML = "";
        updateSkillRack();
        if (game.pendingLevels > 0) {
          game.mode = "playing";
          showLevelUp();
        } else {
          game.mode = "playing";
        }
      }

      function showEvolution(card) {
        overlayRoot.innerHTML = `
          <div class="overlay">
            <section class="modal center evolution-modal">
              <p class="eyebrow">${card.kind === "transcend" ? "TRANSCENDENCE UNLOCKED" : "ULTIMATE EVOLUTION"}</p>
              <div class="card-icon" style="margin:0 auto 18px;font-size:2.8rem;width:90px;height:90px">${card.icon}</div>
              <h2>${card.name}</h2>
              <p>${card.description}</p>
              <div class="modal-actions">
                <button class="modal-button" type="button" data-action="continue-evolution">
                  <span class="key">1</span> 오버드라이브 계속
                </button>
              </div>
            </section>
          </div>
        `;
      }

      function continueEvolution() {
        overlayRoot.innerHTML = "";
        updateSkillRack();
        addBurst(game.player.x, game.player.y, "#ffd56a", options.reducedFx ? 30 : 100, 530);
        game.slowTimer = .65;
        if (game.pendingLevels > 0) {
          game.mode = "playing";
          showLevelUp();
        } else {
          game.mode = "playing";
        }
      }

      function togglePause() {
        if (!game || game.mode === "levelup" || game.mode === "over") return;
        if (game.mode === "paused") {
          game.mode = "playing";
          overlayRoot.innerHTML = "";
          lastTime = performance.now();
        } else {
          game.mode = "paused";
          overlayRoot.innerHTML = pauseMarkup();
        }
      }

      function pauseMarkup() {
        return `
          <div class="overlay">
            <section class="modal center">
              <p class="eyebrow">RIFT PAUSED</p>
              <h2>시간이 멈췄습니다.</h2>
              <p>방향키 또는 WASD로 이동하고, 레벨업 시 숫자키 1~3으로 카드를 선택합니다.</p>
              <div class="modal-actions">
                <button class="modal-button" type="button" data-action="resume"><span class="key">1</span> 계속하기</button>
                <button class="modal-button" type="button" data-action="restart"><span class="key">2</span> 다시 시작</button>
                <button class="modal-button" type="button" data-action="quit"><span class="key">3</span> 타이틀로</button>
              </div>
            </section>
          </div>
        `;
      }

      function finishGame(victory) {
        if (!game || game.mode === "over") return;
        game.mode = "over";
        const timeBonus = Math.floor(game.elapsed * 12);
        const hpBonus = Math.floor(game.player.hp * 35);
        const evolutionCount = Object.values(game.evolutions).filter(Boolean).length;
        const transcendCount = Object.values(game.transcendences).filter(Boolean).length;
        game.score += timeBonus + hpBonus + evolutionCount * 3500 + transcendCount * 5000;
        const buildEntries = [
          ...Object.entries(game.skills).filter(([, level]) => level > 0).map(([id, level]) => `${skillDefs[id].name} LV.${level}`),
          ...Object.entries(game.utilities).filter(([, level]) => level > 0).map(([id, level]) => `${utilityDefs[id].name} LV.${level}`),
          ...Object.entries(game.transcendences).filter(([, active]) => active).map(([id]) => `${transcendDefs[id].name} TRANS`)
        ];
        const travelDistance = Math.floor(Math.hypot(game.camera.x, game.camera.y) / 10);
        const previous = Number(localStorage.getItem(SAVE_KEY) || 0);
        const newBest = game.score > previous;
        if (newBest) localStorage.setItem(SAVE_KEY, String(game.score));

        overlayRoot.innerHTML = `
          <div class="overlay">
            <section class="modal center">
              <p class="eyebrow">${victory ? "RIFT CONQUERED" : "CORE COLLAPSED"}</p>
              <h2>${victory ? "오버드라이브 완성" : "리프트에 삼켜졌습니다"}</h2>
              <p>${newBest ? "새로운 최고 기록입니다!" : "빌드를 조정해 더 높은 기록에 도전하세요."}</p>
              <div class="result-stats">
                <div class="result-stat"><b>${formatNumber(game.score)}</b><small>최종 점수</small></div>
                <div class="result-stat"><b>${game.kills}</b><small>처치</small></div>
                <div class="result-stat"><b>x${game.bestCombo.toFixed(1)}</b><small>최대 콤보</small></div>
              </div>
              <p>도달 레벨 <b>${game.level}</b> · 이동 거리 <b>${travelDistance}m</b> · 궁극 진화 <b>${evolutionCount}</b> · 초월 <b>${transcendCount}</b></p>
              <div class="build-summary">

                <button class="modal-button" type="button" data-action="quit"><span class="key">2</span> 타이틀로</button>
              </div>
            </section>
          </div>
        `;
      }

      function showOptions() {
        showTitleModal(`
